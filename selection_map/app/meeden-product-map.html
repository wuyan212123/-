<title>MEEDEN 产品地图</title>

<style>

  --shadow:0 10px 40px rgba(31,26,48,.18);
  --f-display:"Noto Serif SC","Songti SC",serif; --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1630; --panel:#251F3E; --panel2:#2B2447; --ink:#EEEBF8; --muted:#A49EBF; --line:#433A68; --accent:#A592FF; --accent-ink:#1B1630; --accent-soft:#352C5C;
  --ok:#4CC38A; --ok-soft:#1F3A33; --part:#E5B04A; --part-soft:#3D3222; --plan:#72A2F6; --plan-soft:#22304F; --gap:#FF7B5E; --gap-soft:#45272A; --unk:#9B96B3; --unk-soft:#302A48;
  --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1B1630; --panel:#251F3E; --panel2:#2B2447; --ink:#EEEBF8; --muted:#A49EBF; --line:#433A68; --accent:#A592FF; --accent-ink:#1B1630; --accent-soft:#352C5C;
  --ok:#4CC38A; --ok-soft:#1F3A33; --part:#E5B04A; --part-soft:#3D3222; --plan:#72A2F6; --plan-soft:#22304F; --gap:#FF7B5E; --gap-soft:#45272A; --unk:#9B96B3; --unk-soft:#302A48;
  --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-size:25px;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--gap);border-color:var(--gap)}
.btn:disabled{opacity:.45;cursor:not-allowed}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--f-mono);font-weight:500}
.banner{padding:9px 14px;border-radius:8px;font-size:13px;border:1px solid var(--line);background:var(--panel)}
.banner.warn{background:var(--part-soft);border-color:var(--part)}
.banner.err{background:var(--gap-soft);border-color:var(--gap)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
nav.tree{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 40px);overflow:auto}
@media (max-width:860px){nav.tree{position:static;max-height:260px}}
.tnode{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.tnode:hover{background:var(--panel2)}
.tnode.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tnode .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.tnode.l0{font-weight:700;font-size:14px}
.tnode.l1{padding-left:18px}
.tnode.l2{padding-left:32px;font-size:12.5px}
.tnode .pend{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px}
.main{display:flex;flex-direction:column;gap:10px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.filters input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);width:220px;max-width:100%}
.filters select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel2)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12.5px}
.chip[aria-pressed=false]{opacity:.45}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.count{margin-left:auto;font-size:12.5px;color:var(--muted)}
.skel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.skel h3{margin:0 0 6px;font-size:14px}
.skel table{width:100%;border-collapse:collapse;font-size:12.5px}
.skel td,.skel th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table.rec{width:100%;border-collapse:collapse;font-size:13px;min-width:1080px}
table.rec th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
table.rec th[aria-sort]::after{content:" ↑";color:var(--accent)}
table.rec th[aria-sort=descending]::after{content:" ↓"}
table.rec td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.rec tr{cursor:pointer}
table.rec tbody tr:hover{background:var(--panel2)}
table.rec tr.arch td{opacity:.5}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
td.nw{white-space:nowrap}
@media (max-width:640px){
  .tablebox{overflow:visible;background:transparent;border:0}
  table.rec{min-width:0;font-size:13px}
  table.rec thead{display:none}
  table.rec tbody{display:flex;flex-direction:column;gap:8px}
  table.rec tbody tr{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  table.rec td{border:0;padding:0}
  table.rec td.c-id{grid-row:1;grid-column:1}
  table.rec td.c-form{grid-row:1;grid-column:2;font-weight:700}
  table.rec td.c-meeden_status{grid-row:1;grid-column:3}
  table.rec td.c-sub,table.rec td.c-sugg,table.rec td.c-conclusion,table.rec td.c-gates{grid-column:1/-1;font-size:12.5px}
  table.rec td.c-sub{color:var(--muted)}
  table.rec td.c-sugg::before{content:"建议：";color:var(--muted)}
  table.rec td.c-conclusion::before{content:"人工：";color:var(--muted)}
  table.rec td.c-gates::before{content:"三道闸 ";color:var(--muted)}
  table.rec td.c-lv,table.rec td.c-monthly_units,table.rec td.c-price_usd,table.rec td.c-seg,table.rec td.c-mos,table.rec td.c-confidence,table.rec td.c-upd{display:none}
  table.rec td.empty{grid-column:1/-1}
}
.r{text-align:right}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;white-space:nowrap}
.s-已有{background:var(--ok-soft);color:var(--ok)} .s-部分覆盖{background:var(--part-soft);color:var(--part)} .s-规划中{background:var(--plan-soft);color:var(--plan)} .s-空白{background:var(--gap-soft);color:var(--gap)} .s-未核对{background:var(--unk-soft);color:var(--unk)}
.g{display:inline-block;min-width:22px;text-align:center;font-size:11px;border-radius:4px;padding:0 3px;margin-right:2px}
.g-过{background:var(--ok-soft);color:var(--ok)} .g-不过{background:var(--gap-soft);color:var(--gap)} .g-n{background:var(--unk-soft);color:var(--unk)}
.c-high{color:var(--ok)} .c-mid{color:var(--part)} .c-low{color:var(--gap)}
.pri{font-family:var(--f-mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-right:4px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,16,36,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--panel);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{display:flex;align-items:flex-start;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dhead h2{font-family:var(--f-display);font-size:19px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.dbody{flex:1;overflow:auto;padding:14px 18px 24px;display:flex;flex-direction:column;gap:16px}
.dfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel2)}
.dfoot .msg{flex:1;min-width:160px;font-size:12.5px;color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:9px;padding:10px 12px 12px;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset legend{font-size:12px;color:var(--muted);padding:0 6px;letter-spacing:.06em}
fieldset .full{grid-column:1/-1}
@media (max-width:520px){fieldset{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);font-size:13px;min-width:0;width:100%}
label.f textarea{min-height:58px;resize:vertical}
label.f input:read-only{opacity:.7}
.hint{font-size:11.5px;color:var(--muted)}
.flags{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
.flags label{display:inline-flex;gap:5px;align-items:center}
.asins{display:flex;flex-direction:column;gap:6px}
.arow{display:grid;grid-template-columns:minmax(0,1.3fr) 82px minmax(0,1fr) 30px;gap:6px;align-items:center}
.arow input,.arow select{padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);font-size:12.5px;min-width:0;width:100%}
.calc{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.calc h4{margin:0;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:2px}
.kv span:first-child{color:var(--muted);font-size:12px}
.lvl{width:100%;border-collapse:collapse;font-size:12.5px}
.lvl td,.lvl th{border-top:1px solid var(--line);padding:4px 6px;text-align:left}
.hist{font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.hist .it{border-left:2px solid var(--line);padding-left:8px}
.hist .t{color:var(--muted);font-size:11.5px}
.conflict{background:var(--part-soft);border:1px solid var(--part);border-radius:8px;padding:10px;font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:40}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>MEEDEN 产品地图</h1>
      <p class="sub" id="sub">按 2027 产品规划导图记录每个细分形态：MEEDEN 覆盖、市场数据、三道闸、机会评分和结论</p>
    </div>
    <div class="actions">
      <button class="btn primary" id="bNew" type="button" hidden>+ 新增形态</button>
      <button class="btn" id="bLog" type="button">活动记录</button>
      <button class="btn" id="bExpJ" type="button">导出 JSON</button>
      <button class="btn" id="bExpC" type="button">导出 CSV</button>
      <button class="btn" id="bImp" type="button" hidden>导入 JSON</button>
      <input type="file" id="fImp" accept=".json,application/json" hidden>
      <a class="btn" href="https://claude.ai/artifact/8niUdHwDaivCgh4uLcR8y3" target="_blank" rel="noopener">思维导图 ↗</a>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div id="banner" class="banner">正在连接数据库…</div>
  <div class="layout">
    <nav class="tree" id="tree" aria-label="分类"></nav>
    <div class="main">
      <div class="filters" role="search">
        <input type="search" id="q" placeholder="搜索形态、英文词、ASIN、对标" aria-label="搜索">
        <span id="stChips" style="display:inline-flex;flex-wrap:wrap;gap:6px"></span>
        <select id="fConc" aria-label="结论">
          <option value="">全部结论</option><option value="立项评审">建议：立项评审</option><option value="观察池">建议：观察池</option>
          <option value="待数据">建议：待数据</option><option value="老品升级">建议：老品升级</option><option value="按导图推进">建议：按导图推进</option>
          <option value="淘汰">建议：淘汰 / C 档</option><option value="h:">人工结论：已填写</option>
        </select>
        <select id="fConf" aria-label="可信度"><option value="">全部可信度</option><option>高</option><option>中</option><option>低</option><option value="-">无数据</option></select>
        <label class="chip"><input type="checkbox" id="fOpp"> 只看机会（A/B）</label>
        <label class="chip"><input type="checkbox" id="fArch"> 显示已归档</label>

      </div>
      <div id="skel" hidden></div>
      <div class="tablebox"><table class="rec" id="tbl"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </div>
</div>

<script>
/* MEEDEN 选品地图评分（scoring.py 的 JS 版，规则必须与 scoring.py 完全一致）。
 * 浏览器里挂在 window.MeedenScoring，node 里 module.exports。
 * 改规则时两边一起改，并运行 python3 selection_map/app/check_scoring.py 对比。 */
(function (root) {
  "use strict";
  var GAP_PAT = /规划中|？|\?|新小类|新形态|空位/;
  function num(x) { return typeof x === "number" && isFinite(x); }
  function gates(r, th) {
    var g1 = num(r.n_pass) ? (r.n_pass >= th.g1_min_pass ? "过" : "不过") : null;
    var g2 = null;
    if (num(r.cr1)) {
      var ok = r.cr1 <= th.g2_cr1_max && (!num(r.yoy_growth) || r.yoy_growth >= th.g2_yoy_min);
      g2 = ok ? "过" : "不过";
    }
    var flags = r.risk_flags || [];
    var g3 = flags.indexOf("hazmat") >= 0 ? "不过" : "过";
    return [g1, g2, g3];
  }
  function synergyCount(t) {
    if (!t || t.trim() === "—" || t.trim() === "-") return 0;
    return t.split(/[、；;,，]/).filter(function (p) { return p.trim(); }).length;
  }
  function mos(r, meta) {
    var b = {}, gaps = [], rev = r.seg_revenue_top10;
    if (num(rev)) b["需求规模"] = rev >= 500000 ? 25 : rev >= 200000 ? 20 : rev >= 100000 ? 15 : rev >= 50000 ? 10 : 5;
    else { b["需求规模"] = 0; gaps.push("细分市场销售额"); }
    var s = 0, miss = [];
    if (num(r.n_pass)) s += r.n_pass >= 3 ? 8 : r.n_pass >= 2 ? 5 : 0; else miss.push("达标单品数");
    if (num(r.cr3)) s += r.cr3 < 0.5 ? 6 : r.cr3 <= 0.7 ? 3 : 0; else miss.push("CR3");
    if (num(r.n_new_top50)) s += r.n_new_top50 >= 2 ? 6 : r.n_new_top50 >= 1 ? 3 : 0; else miss.push("新品数");
    b["可进入性"] = s; gaps = gaps.concat(miss);
    var y = r.yoy_growth;
    if (num(y)) b["增长"] = y >= 0.2 ? 10 : y >= 0 ? 6 : y >= -0.2 ? 2 : 0; else { b["增长"] = 0; gaps.push("同比增长"); }
    var flags = r.risk_flags || [], has = function (f) { return flags.indexOf(f) >= 0; };
    var pfr = r.price_fee_ratio, p50 = r.price_p50, e;
    if (has("hazmat")) e = 0;
    else if (num(pfr)) e = pfr >= 5 ? 15 : pfr >= 3 ? 10 : pfr >= 2 ? 6 : 3;
    else if (num(p50)) e = p50 >= 25 ? 12 : p50 >= 15 ? 9 : 5;
    else { e = 0; gaps.push("价格带 / FBA 费用"); }
    var st = String(r.size_tier == null ? "None" : r.size_tier).toLowerCase();
    if (has("oversize") || st.indexOf("大件") >= 0 || st.indexOf("oversize") >= 0) e = Math.max(0, e - 3);
    b["经济性"] = e;
    var sc = 0;
    if ((r.meeden_status === "空白" || r.meeden_status === "部分覆盖") && GAP_PAT.test(r.framework_ref || "")) sc += 8;
    var n = synergyCount(r.synergy); sc += n >= 2 ? 6 : n === 1 ? 3 : 0;
    var lv = r.levels || {};
    var l23 = ["L2", "L3"].some(function (k) { var L = lv[k] || {}; return (L.seg_units || 0) > 0 && !(L.meeden_asins && L.meeden_asins.length); });
    var catFit = (meta.attack_categories || []).indexOf(r.category) >= 0;
    var lowEnd = r.category === "快消工具" && num(p50) && p50 < 10;
    if ((catFit || l23) && !lowEnd) sc += 6;
    b["战略契合"] = sc;
    var d = 0;
    if (has("child")) d -= 4;
    if (has("patent")) d -= 4;
    if (num(r.cr1) && r.cr1 > 0.5) d -= 3;
    if (num(r.season_index) && r.season_index > 3) d -= 2;
    if (r.confidence === "低") d -= 2;
    b["风险扣分"] = Math.max(d, -15);
    var score = 0; for (var k in b) score += b[k];
    var complete = gaps.indexOf("细分市场销售额") < 0 && gaps.indexOf("达标单品数") < 0;
    return { score: Math.max(score, 0), breakdown: b, complete: complete, gaps: gaps };
  }
  function suggest(r, meta) {
    var th = meta.thresholds, st = r.meeden_status, g1 = r.gate_g1, g3 = r.gate_g3;
    if (st === "已有") return "老品升级";
    if (g3 === "不过") return "淘汰（硬伤）";
    if (st === "规划中") {
      if (r.mos_complete && (r.mos_score || 0) >= meta.mos.tier_a) return "按导图推进（建议提前）";
      return "按导图推进";
    }
    if (g1 == null) {
      var u = r.monthly_units;
      if (num(u)) {
        var single = u >= th.pass_units || (num(r.price_usd) && u * r.price_usd >= th.pass_revenue_usd);
        return single ? "待数据（V1 单品达标）" : (u < 500 ? "待数据（V1 单品偏低）" : "待数据（V1 单品接近）");
      }
      return "待数据";
    }
    if (g1 === "不过") {
      var u2 = r.monthly_units;
      return ((num(u2) && u2 >= 500) || r.trend_signal) ? "观察池" : "淘汰";
    }
    if (r.gate_g2 === "不过") return "观察池（市场集中或萎缩）";
    if (r.gate_g2 == null) return "待数据（缺集中度）";
    if ((meta.future_categories || []).indexOf(r.category) >= 0 || (r.risk_flags || []).indexOf("child") >= 0) return "观察池（2028 产品线）";

async function loadHistory(id){
  const list=$("histList"); if(!list||!S.db) return;
  try{
    const snap=await S.db.collection("log").where("form_id","==",id).orderBy("at","desc").limit(30).get();
    const items=snap.docs.map(d=>d.data());
    const ps = S.user && items.length ? await S.user.profiles([...new Set(items.map(i=>i.by).filter(Boolean))]) : {};
    if (!$("histList")) return;
    list.replaceChildren(...(items.length?items.map(i=>logItem(i,ps)):[document.createTextNode("还没有修改记录。")]));
  }catch(e){ list.textContent="读取修改记录失败："+(e.message||e.code); }

const ACT={create:"新增",edit:"修改",archive:"归档",restore:"恢复",import:"导入"};
function logItem(i,ps){
  const who = i.by ? ((ps[i.by]&&ps[i.by].name)||"某位成员") : "仓库导入";
  const ch = i.changes ? Object.entries(i.changes).map(([k,v])=>`${k}：${short(v[0])} → ${short(v[1])}`).join("；") : (i.detail||"");
  return h("div",{class:"it"},h("div",{class:"t"},`${(i.at||"").replace("T"," ").slice(0,16)} · ${who} · ${ACT[i.action]||i.action}${i.form_id&&!ED?" · "+i.form_id+" "+(i.form||""):""}`),ch?h("div",{},ch):null);
}
const short = v => { if (v==null||v==="") return "空"; const s = typeof v==="string" ? v : JSON.stringify(v); return s.length>60 ? s.slice(0,60)+"…" : s; };
function diff(a,b){ const out={}; for (const k of MANUAL){ const x=a?a[k]:undefined, y=b[k]; if (JSON.stringify(x??null)!==JSON.stringify(y??null)) out[k]=[x??null,y??null]; } return out; }
function validate(r){
  if (!r.category) return "请选择大类";
  if (!(r.form||"").trim()) return "请填写细分形态";
  if (!(r.keyword_en||"").trim()) return "请填写英文核心词";
  if (!(r.group||"").trim()) return "请填写组";
  if (r.priority && !/^[AB]\d+$/.test(r.priority)) return "机会优先级要写成 A1、B2 这样的格式";
  for (const a of r.meeden_asins||[]) if (a.asin && !/^B0[0-9A-Z]{8}$/.test(a.asin)) return "ASIN 格式不对："+a.asin;
  if (r.evidence_asin && !/^B0[0-9A-Z]{8}$/.test(r.evidence_asin)) return "主要证据 ASIN 格式不对";
  if (r.meeden_status==="已有" && !r.evidence_asin && !(r.meeden_asins||[]).some(a=>a.asin)) return "状态为「已有」时必须至少填一个 MEEDEN ASIN";
  for (const k of ["monthly_units","price_usd"]) if (r[k]!=null && !(num(r[k])&&r[k]>=0)) return "数字字段不能为负";
  return null;
}
function setMsg(t,err){ const m=$("emsg"); if(m){ m.textContent=t; m.style.color=err?"var(--gap)":""; } }
async function log(entry){ try{ await S.db.collection("log").add(Object.assign({at:new Date().toISOString(),by:S.uid||null},entry)); }catch(e){ /* 记录失败不影响保存 */ } }
async function claimId(cat){
  const pre=(S.meta.prefixes||{})[cat]; if(!pre) throw new Error("这个大类还没有编号前缀");
  let n=Math.max(0,...allRecs().filter(r=>r.id&&r.id.startsWith(pre)).map(r=>parseInt(r.id.slice(pre.length),10)||0))+1;
  for (let tries=0; tries<20; tries++, n++){
    const id=pre+String(n).padStart(3,"0"), ref=S.db.doc("forms/"+id);
    const lease=await ref.acquire({holder:S.uid||("t"+Math.random().toString(36).slice(2)),ttlMs:5000});
    if (!lease.acquired) continue;
    const cur=await ref.get(); if (cur.exists && cur.data().form) continue;
    return id;
  }
  throw new Error("分配编号失败，请稍后再试");
}
async function save(force){
  if (!ED || !S.db) return;
  const r=ED.rec, err=validate(r); if (err){ setMsg(err,true); return; }
  ["form","keyword_en","group","subcategory","spec","framework_ref"].forEach(k=>{ if(typeof r[k]==="string") r[k]=r[k].trim(); });
  r.meeden_asins=(r.meeden_asins||[]).filter(a=>a.asin);
  const btn=$("bSave"); if(btn) btn.disabled=true; setMsg("保存中…");
  try{
    const now=new Date().toISOString();
    if (ED.isNew){
      const id=await claimId(r.category); r.id=id;
      const doc=Object.assign({},r,{created_at:now,created_by:S.uid||null,updated_at:now,updated_by:S.uid||null});
      await S.db.doc("forms/"+id).set(doc);
      await log({action:"create",form_id:id,form:r.form,changes:null,detail:`新增「${r.form}」`});
      toast("已新增 "+id); closeEditor(); return;
    }
    const ref=S.db.doc("forms/"+r.id), cur=(await ref.get()).data()||{};
    if (!force && (cur.updated_at||"")!==ED.openedAt){
      setMsg(""); if(btn) btn.disabled=false;
      const box=h("div",{class:"conflict",role:"alert"},`这个形态在你编辑期间被修改过（${(cur.updated_at||"").replace("T"," ").slice(0,16)}）。`,
        h("button",{type:"button",class:"btn",onclick:()=>{closeEditor();openEditor(r.id);}},"放弃我的修改，重新打开"),
        h("button",{type:"button",class:"btn danger",onclick:()=>{box.remove();save(true);}},"仍然保存（覆盖对方改动）"));
      $("emsg").before(box); return;
    }
    const ch=diff(cur,r);
    if (!Object.keys(ch).length){ setMsg("没有改动"); if(btn) btn.disabled=false; return; }
    const patch={updated_at:now,updated_by:S.uid||null}; for (const k of Object.keys(ch)) patch[k]=r[k]??null;
    await ref.update(patch);
    await log({action:"edit",form_id:r.id,form:r.form,changes:ch});
    toast("已保存 "+r.id); closeEditor();
  }catch(e){
    if(btn) btn.disabled=false;
    setMsg(e.code==="invalid_argument" ? "没有写入权限，或内容格式不对。" : e.code==="quota_exceeded" ? "数据库容量已满，请联系页面所有者。" : "保存失败："+(e.message||e.code),true);
    if (e.code==="invalid_argument" && S.canWrite==null){ S.canWrite=false; }
  }
}
async function toggleArchive(){
  const r=ED.rec, to=!r.archived;
  try{
    await S.db.doc("forms/"+r.id).update({archived:to,updated_at:new Date().toISOString(),updated_by:S.uid||null});
    await log({action:to?"archive":"restore",form_id:r.id,form:r.form,changes:{archived:[!to,to]}});
    toast(to?"已归档 "+r.id+"（编号保留，不会被复用）":"已恢复 "+r.id); closeEditor();
  }catch(e){ setMsg("操作失败："+(e.message||e.code),true); }
}

function exportObj(){
  const recs=allRecs().sort((a,b)=>a.id.localeCompare(b.id));
  const {skeleton, ...meta}=S.meta;
  return {meta:Object.assign({},meta,{exported_from:"MEEDEN 产品地图（网页）",exported_at:new Date().toISOString(),manual_fields:MANUAL}),records:recs,skeleton:skeleton||[]};
}
async function saveFile(filename,data){
  if (!S.dl){ toast("这个视图不支持下载文件"); return; }
  try{ await S.dl.save({filename,data}); toast("已导出 "+filename); }
  catch(e){ if(e.code!=="declined") toast(e.code==="rate_limited"?"已有一个下载确认框，请先处理":"导出失败："+(e.message||e.code)); }
}
function csvCell(v){ const s = v==null ? "" : (typeof v==="object" ? JSON.stringify(v) : String(v)); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportCSV(){
  const cols=[["编号","id"],["大类","category"],["组","group"],["小类","subcategory"],["形态","form"],["规格","spec"],["英文核心词","keyword_en"],["导图对应","framework_ref"],
    ["MEEDEN 状态","meeden_status"],["主要 ASIN","evidence_asin"],["头部单品","benchmark"],["头部月销","monthly_units"],["售价","price_usd"],["Top10 月销售额","seg_revenue_top10"],
    ["达标单品数","n_pass"],["第一品牌份额","cr1"],["G1",null],["G2",null],["G3",null],["机会评分",null],["建议结论",null],["人工结论","conclusion"],["优先级","priority"],
    ["可信度","confidence"],["数据来源","data_source"],["数据日期","as_of"],["备注","note"],["已归档","archived"],["更新时间","updated_at"]];
  const lines=[cols.map(c=>c[0]).join(",")];
  for (const r of allRecs().sort((a,b)=>a.id.localeCompare(b.id))){

const COMPUTED=["browse_nodes","keyword_cluster","levels","level_cut","own_units","own_share","own_rating","own_return_rate","seg_units_top10","seg_revenue_top10","n_pass","search_volume",
  "yoy_growth","season_index","peak_months","cr1","cr3","reviews_median_top10","n_new_top50","new_avg_units","share_cn_sellers","share_big_brand","rating_avg_top10","low_star_share",
  "cpc_suggested","price_p25","price_p50","price_p75","size_tier","fba_fee_est","price_fee_ratio","v1_snapshot"];
const FROM_TOOL=["benchmark","monthly_units","price_usd","data_source","as_of","confidence","evidence_ref"];
async function importFile(file){
  let obj; try{ obj=JSON.parse(await file.text()); }catch(e){ toast("不是有效的 JSON 文件"); return; }
  const recs=Array.isArray(obj.records)?obj.records:null;
  if (!recs || !recs.every(r=>r&&typeof r.id==="string"&&/^[A-Z]\d{3,}$/.test(r.id)&&r.form)){ toast("文件里没有符合格式的 records（需要 product_map.json）"); return; }
  const add=recs.filter(r=>!S.recs.has(r.id)), upd=recs.filter(r=>S.recs.has(r.id));
  const box=h("div",{class:"dbody"},
    h("p",{},`文件：${file.name}`),h("p",{},`新增 ${add.length} 个形态，更新 ${upd.length} 个形态的计算字段。`),
    h("p",{class:"hint"},"规则：新形态整条写入。已有的形态只更新导入脚本算出的字段（细分市场指标、分级、自有销量）；工具数据（可信度为「高」）同时更新头部单品和数据来源。网页里人工填写的结论、状态、备注等不会被覆盖。"),
    h("label",{class:"chip",style:"align-self:flex-start"},h("input",{type:"checkbox",id:"impMeta",checked:true})," 同时更新门槛、分类顺序和待扫描骨架"));
  const go=h("button",{type:"button",class:"btn primary",onclick:async()=>{
    go.disabled=true; const msg=$("impMsg"); let done=0, fail=0; const now=new Date().toISOString();
    const jobs=[...add.map(r=>({r,isNew:true})),...upd.map(r=>({r,isNew:false}))];
    const run=async({r,isNew})=>{
      try{
        if (isNew){ await S.db.doc("forms/"+r.id).set(Object.assign({},r,{archived:!!r.archived,created_at:now,created_by:S.uid||null,updated_at:now,updated_by:S.uid||null})); }
        else {
          const patch={}; for (const k of COMPUTED) if (k in r) patch[k]=r[k]??null;
          if (r.confidence==="高") for (const k of FROM_TOOL) patch[k]=r[k]??null;
          if (Object.keys(patch).length) await S.db.doc("forms/"+r.id).update(patch);
        }
        done++;
      }catch(e){ fail++; }
      msg.textContent=`已处理 ${done+fail} / ${jobs.length}`+(fail?`，失败 ${fail}`:"");
    };
    for (let i=0;i<jobs.length;i+=6) await Promise.all(jobs.slice(i,i+6).map(run));
    if ($("impMeta").checked && obj.meta){
      const m={}; for (const k of ["thresholds","mos","category_order","attack_categories","future_categories","version"]) if (obj.meta[k]!=null) m[k]=obj.meta[k];
      if (Array.isArray(obj.skeleton)) m.skeleton=obj.skeleton;
      try{ await S.db.doc("meta/app").update(m); }catch(e){ try{ await S.db.doc("meta/app").set(Object.assign({},DEFAULT_META,m)); }catch(e2){ fail++; } }
    }
    await log({action:"import",form_id:null,form:null,detail:`导入 ${file.name}：新增 ${add.length}，更新 ${upd.length}${fail?`，失败 ${fail}`:""}`});
    msg.textContent=`完成：新增 ${add.length}，更新 ${upd.length}`+(fail?`，失败 ${fail}`:"");
    toast("导入完成");
  }},"开始导入");
  const drawer=h("div",{class:"drawer",role:"dialog","aria-modal":"true","aria-label":"导入"},h("div",{class:"dhead"},h("h2",{},"导入 product_map.json")),box,
    h("div",{class:"dfoot"},h("span",{class:"msg",id:"impMsg"}),h("button",{type:"button",class:"btn",onclick:closeEditor},"关闭"),go));
  $("layer").replaceChildren(h("div",{class:"scrim",onclick:closeEditor}),drawer);
}
