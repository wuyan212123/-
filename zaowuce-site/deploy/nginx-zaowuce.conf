# /etc/nginx/conf.d/zaowuce.conf
# 证书：在阿里云「数字证书管理服务」申请免费证书，下载 Nginx 格式，放到 /etc/nginx/cert/
# 备案完成前，北京地域服务器上的域名无法对外访问。

server {
    listen 80;
    listen [::]:80;
    server_name zaowuce.com www.zaowuce.com;
    return 301 https://zaowuce.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.zaowuce.com;
    ssl_certificate     /etc/nginx/cert/zaowuce.com.pem;
    ssl_certificate_key /etc/nginx/cert/zaowuce.com.key;
    return 301 https://zaowuce.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zaowuce.com;

    ssl_certificate     /etc/nginx/cert/zaowuce.com.pem;
    ssl_certificate_key /etc/nginx/cert/zaowuce.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # 网站只接收登录、改密码等小请求
    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/zaowuce.access.log;
    error_log  /var/log/nginx/zaowuce.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 下载包直接从 Node 流式传出，不在 Nginx 落盘
    location /downloads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
    }
}
