function openDraft(which){const r=S.scope[which];S.draft={which,s:r.s,e:r.e,month:r.e.slice(0,7),pick:0,refA:clone(S.scope.A)}}
function switchProject(id){
  S.projectId=id;S.noProject=false;S.loadError=false;S.scope=defScope();S.scope.source=S.shown?S.shown.source:'term';S.shown=clone(S.scope);S.err=null;S.loading=false;
  S.list={view:'all',tag:'all',q:'',orders:'all',sort:{k:'A_spend',d:-1},page:1,size:S.list.size};S.picked.clear();S.cyc={step:'prep',done:new Set(),sel:{},bk:'down',camp:null,completed:null};S.sel=null;S.last=null;S.expanded.clear();S.ruleDraft=null;
}
const ACT={
  nav:t=>{S.view=t.dataset.v;S.pop=null;if(location.hash!=='#'+S.view)history.replaceState(null,'','#'+S.view)},
  pop:t=>{const p=t.dataset.pop;if(S.pop===p){S.pop=null;return}S.pop=p;if(p.startsWith('date-'))openDraft(p.slice(5));if(p==='filters')S.fdraft=clone(S.scope.f);if(p==='project')S.pq=''},
  closepop:()=>{S.pop=null},
  src:t=>{if(S.scope.source===t.dataset.v)return;S.scope.source=t.dataset.v;S.pop=null;refresh()},
  dSet:t=>{Object.assign(S.draft,{s:t.dataset.s,e:t.dataset.e,pick:0,month:t.dataset.e.slice(0,7)})},
  dDay:t=>{const d=t.dataset.d,D=S.draft;if(!D.pick){D.s=d;D.e=d;D.pick=1}else{if(d<D.s){D.e=D.s;D.s=d}else D.e=d;D.pick=0}},
  dMonth:t=>{const [y,m]=S.draft.month.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1+(+t.dataset.v),1));S.draft.month=dt.toISOString().slice(0,7)},
  dApply:()=>{const D=S.draft;S.scope[D.which]={s:D.s,e:D.e||D.s};S.pop=null;refresh()},
  fT:t=>{const a=S.fdraft[t.dataset.k],v=t.dataset.v,i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)},
  fClear:()=>{S.fdraft={campaigns:[],adgroups:[],match:[],target:'',term:''}},
  fApply:()=>{S.scope.f=clone(S.fdraft);S.pop=null;refresh()},
  proj:t=>{const id=t.dataset.id;S.pop=null;S.demo='normal';if(id!==S.projectId||S.noProject){switchProject(id);toast(`已切换到 ${projById(id).name}，筛选已清空`)}if(t.dataset.go)S.view=t.dataset.go;else if(['projects'].includes(S.view))S.view='overview'},
  retry:()=>{S.failNext=false;refresh()},
  revert:()=>{S.scope=clone(S.shown);S.err=null},
  reload:()=>{S.loadError=false;S.demo='normal';toast('已重新读取')},
  tag:t=>{S.list.tag=t.dataset.v;S.list.page=1},
  ord:t=>{S.list.orders=t.dataset.v;S.list.page=1},
  sort:(t,e)=>{if(e.target.closest('.rz')||e.target.closest('.pick'))return false;const k=t.dataset.k,L=S.list;if(L.sort.k===k)L.sort.d=L.sort.d===-1?1:-1;else L.sort={k,d:(k==='kw'||k==='match'||k==='kwtype'||k==='adgroup'||k==='target')?1:-1};L.page=1},
  exp:t=>{const k=t.dataset.key;S.expanded.has(k)?S.expanded.delete(k):S.expanded.add(k)},
  open:t=>{S.sel=t.dataset.key;S.last=t.dataset.key},
  close:()=>{render.focusKey=S.sel;S.sel=null},
  dnav:t=>{const R=calc(S.shown),all=listRows(R),i=all.findIndex(x=>x.key===S.sel),n=all[i+(+t.dataset.v)];if(n){S.sel=n.key;S.last=n.key;const pi=Math.floor(all.indexOf(n)/S.list.size)+1;if(pi!==S.list.page)S.list.page=pi;setTimeout(()=>{const r=document.querySelector(`tr.r[data-key="${CSS.escape(n.key)}"]`);if(r)r.scrollIntoView({block:'nearest'})},0)}},
  page:t=>{S.list.page=+t.dataset.v;const tw=document.getElementById('tw');if(tw)tw.scrollTop=0},
  size:t=>{S.list.size=+t.dataset.v;S.list.page=1},
  colT:t=>{const id=t.dataset.id;const i=S.cols.indexOf(id);i<0?S.cols.push(id):S.cols.splice(i,1);store.set('cols',S.cols)},
  colM:t=>{const id=t.dataset.id,i=S.cols.indexOf(id),j=i+(+t.dataset.v);if(j<1||j>=S.cols.length)return;[S.cols[i],S.cols[j]]=[S.cols[j],S.cols[i]];store.set('cols',S.cols)},
  colReset:()=>{S.cols=[...DEF_COLS];store.set('cols',S.cols)},
  wReset:()=>{S.colW={};store.set('colW',{})},
  doExport:()=>{S.pop=null;toast('演示：已按分析范围生成 Excel（原型不下载文件）','download')},
  genReport:()=>{S.view='reports';S.report.sel='cur';S.report.type=S.sel?'kw':'weekly';history.replaceState(null,'','#reports')},
  genReportCmp:()=>{S.view='reports';S.report.sel='cur';S.report.type='cmp';history.replaceState(null,'','#reports')},
  copyKw:t=>{copy(t.dataset.key,'已复制关键词')},
  toView:t=>{S.view='keywords';S.list.view=t.dataset.v;S.list.tag='all';S.list.page=1;S.list.q='';S.sel=null;history.replaceState(null,'','#keywords')},
  kwView:t=>{S.list.view=t.dataset.v;S.list.tag='all';S.list.page=1},
  density:t=>{S.density=t.dataset.v;store.set('density',S.density)},
  pick:t=>{const k=t.dataset.key;S.picked.has(k)?S.picked.delete(k):S.picked.add(k)},
  pickAll:()=>{const R=calc(S.shown),L=S.list,page=listRows(R).slice((L.page-1)*L.size,L.page*L.size),allP=page.length&&page.every(k=>S.picked.has(k.key));page.forEach(k=>allP?S.picked.delete(k.key):S.picked.add(k.key))},
  bulk:t=>{const v=t.dataset.v,keys=[...S.picked];if(v==='clear'){S.picked.clear();return}if(v==='copy'){copy(keys.join('\n'),`已复制 ${keys.length} 个关键词`);return}keys.forEach(k=>setDec(k,v));S.picked.clear();toast(`${keys.length} 个词已标记为${v==='adopt'?'已采纳':'暂不处理'}，会写入本期复盘`)},
  decide:t=>{const v=t.dataset.v,k=t.dataset.key;if(v==='undo'){delete S.decisions[decKey(k)];store.set('dec',S.decisions);return}setDec(k,v,t.dataset.a);toast(v==='adopt'?'已采纳，会写入本期复盘':'已标记为暂不处理')},
  ovMetric:t=>{S.ovMetric=t.dataset.v},
  cmd:()=>{S.cmd={q:'',i:0};S.pop=null},
  cmdRun:t=>{runCmd(+t.dataset.i)},
  cmdClose:(t,e)=>{if(e.target.closest('[data-stop]'))return false;S.cmd=null},
  toTag:t=>{const v=t.dataset.v;S.list.view=v.startsWith('sg:')||TAGKIND[v]==='opp'?'opp':TAGKIND[v]==='risk'?'risk':'all';S.view='keywords';S.list.tag=t.dataset.v;S.list.page=1;S.list.q='';S.sel=null;history.replaceState(null,'','#keywords')},
  openKw:t=>{const k=t.dataset.key;S.view='keywords';S.list.tag='all';S.list.q='';const R=calc(S.shown);const all=listRows(R);const i=all.findIndex(x=>x.key===k);S.list.page=Math.floor(Math.max(0,i)/S.list.size)+1;S.sel=k;S.last=k;history.replaceState(null,'','#keywords');setTimeout(()=>{const r=document.querySelector(`tr.r[data-key="${CSS.escape(k)}"]`);if(r)r.scrollIntoView({block:'center'})},0)},
  clearList:()=>{S.list.tag='all';S.list.q='';S.list.orders='all';S.list.page=1},
  clearScopeF:()=>{S.scope.f={campaigns:[],adgroups:[],match:[],target:'',term:''};refresh()},
  resetDates:()=>{const d=defScope();S.scope.A=d.A;S.scope.B=d.B;S.scope.f=d.f;refresh()},
  help:()=>{S.modal={kind:'help'}},
  mClose:(t,e)=>{if(e.target.closest('[data-stop]')&&!e.target.closest('[data-act="mClose"]'))return false;if(t.dataset.toast)toast(t.dataset.toast);S.modal=null},
  diagMode:t=>{S.diag.mode=t.dataset.v},
  diagWin:t=>{S.diag.win=+t.dataset.v},
  diagMetric:t=>{S.diag.metric=t.dataset.v},
  diagWf:t=>{S.diag.wf=t.dataset.v},
  cycStep:t=>{const C=S.cyc;if(C.step!==t.dataset.v)C.done.add(C.step);C.step=t.dataset.v;S.sel=null;S.view='cycle';render.resetScroll=true;history.replaceState(null,'','#cycle')},
  cycSel:t=>{const cd=cycleData(calc(S.shown)),a=[...cd.harvest,...cd.neg,...cd.bids].find(x=>x.id===t.dataset.id);if(a)S.cyc.sel[a.id]=!isSel(a)},
  cycAll:t=>{const cd=cycleData(calc(S.shown)),v=t.dataset.v,list=v==='harvest'?cd.harvest:v==='neg'?cd.neg:cd.bids.filter(x=>x.kind===S.cyc.bk&&(!S.cyc.camp||x.g.camp===S.cyc.camp));const all=list.length&&list.every(isSel);list.forEach(a=>{S.cyc.sel[a.id]=!all})},
  cycBk:t=>{S.cyc.bk=t.dataset.v},
  cycCamp:t=>{S.cyc.camp=t.dataset.v||null;if(t.dataset.go){const cd=cycleData(calc(S.shown));const c=t.dataset.v;const order=['down','down0','pause','up'];S.cyc.bk=order.find(k=>cd.bids.some(x=>x.kind===k&&x.g.camp===c))||'down';S.cyc.done.add(S.cyc.step);S.cyc.step='bid';render.resetScroll=true}},
  cycWin:()=>{const lag=S.rules.lag;const A={s:addD(LAST,-(lag+13)),e:addD(LAST,-lag)};S.scope.A=A;S.scope.B={s:addD(A.s,-14),e:addD(A.s,-1)};refresh();toast('已改用推荐窗口：近 14 天，排除最近 '+lag+' 天未结算数据')},
  srcTerm:()=>{S.scope.source='term';refresh()},
  cycExport:t=>{toast(t.dataset.v==='log'?'演示：动作日志（.csv）已生成，原型不下载文件':'演示：批量操作表（.xlsx）已按亚马逊格式生成，原型不下载文件','file-down')},
  cycDone:()=>{const d=new Date();S.cyc.done.add('export');S.cyc.completed=`${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;toast('本周期已完成：动作已写入本周复盘，下周期在“准备与回看”中查看效果')},
  bMode:t=>{S.bMode=t.dataset.v;store.set('bmode',S.bMode)},
  diagApply:()=>{const g=S.diag;if(g.mode==='event'){S.scope.A={s:g.event,e:addD(g.event,g.win-1)};S.scope.B={s:addD(g.event,-g.win),e:addD(g.event,-1)}}else{S.scope.A={s:addD(g.wA,-6),e:g.wA};S.scope.B={s:addD(g.wB,-6),e:g.wB}}refresh()},
  dataStage:t=>{S.data.stage=t.dataset.v},
  importGo:()=>{S.data.stage='importing';setTimeout(()=>{S.data.stage='done';render()},1400)},
  delArch:t=>{S.modal={kind:'delArch',i:+t.dataset.v,ok:false}},
  delDo:()=>{S.modal=null;toast('演示：未执行删除。实际删除会立即影响分析结果','trash-2')},
  repSel:t=>{S.report.sel=t.dataset.v},
  repOpen:t=>{S.view='reports';S.report.sel=t.dataset.v;history.replaceState(null,'','#reports')},
  repType:t=>{S.report.type=t.dataset.v},
  repSrc:t=>{S.report.src=t.dataset.v},
  repGen:()=>{if(S.report.src==='ai'&&!S.aiTested){toast('AI 连接尚未验证，请先在分析规则中测试连接','circle-alert');return}S.report.state='gen';clearTimeout(ACT.rt);ACT.rt=setTimeout(()=>{S.report.state='done';const d=new Date();S.report.genAt=`2026-10-27 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;render()},1800)},
  copyRep:()=>{const R=calc(S.shown);copy(reportMd(R),'已复制报告正文（Markdown）')},
  mdExport:()=>{toast('演示：原型不下载文件，实际会导出 .md','file-down')},
  repSave:()=>{toast('已保存到报告历史（演示）')},
  newProj:()=>{S.modal={kind:'projForm'}},
  editProj:t=>{S.modal={kind:'projForm',id:t.dataset.id}},
  delProj:t=>{S.modal={kind:'delProj',id:t.dataset.id}},
  ruleNew:()=>{S.ruleDraft.newMode=!S.ruleDraft.newMode},
  ruleDelW:t=>{S.ruleDraft[t.dataset.k].splice(+t.dataset.v,1)},
  ruleReset:()=>{S.ruleDraft=clone(S.rules)},
  ruleSave:()=>{S.rules=clone(S.ruleDraft);memo={};toast('规则已保存，分析结果已按新规则重算')},
  aiTest:()=>{S.aiTested=true;toast('演示：连接测试通过')},
  demo:t=>{applyDemo(t.dataset.v)}
};
function copy(text,msg){const done=()=>toast(msg,'copy');try{navigator.clipboard.writeText(text).then(done,()=>toast('浏览器不允许写入剪贴板，请手动复制','circle-alert'))}catch(e){toast('浏览器不允许写入剪贴板，请手动复制','circle-alert')}}
function applyDemo(v){
  S.pop=null;S.demo=v;S.loadError=false;S.noProject=false;S.failNext=false;S.err=null;
  const base=()=>{if(S.projectId==='p4'||S.noProject)switchProject('p1');S.scope=defScope();S.shown=clone(S.scope);S.list.q='';S.list.tag='all';S.list.page=1};
  switch(v){
    case 'normal':base();break;
    case 'noproject':S.noProject=true;S.view='overview';break;
    case 'empty':switchProject('p4');S.view='overview';break;
    case 'nodata':base();S.scope.f.term='portable blender with ice crusher';S.shown=clone(S.scope);S.view='keywords';break;
    case 'listempty':base();S.view='keywords';S.list.q='ice crusher';break;
    case 'nobase':base();S.scope.B={s:'2026-06-01',e:'2026-06-07'};S.shown=clone(S.scope);S.view='keywords';break;
    case 'coverage':base();S.scope.A={s:'2026-08-14',e:'2026-08-20'};S.scope.B={s:'2026-08-07',e:'2026-08-13'};S.shown=clone(S.scope);S.view='overview';break;
    case 'loaderror':base();S.loadError=true;S.view='keywords';break;
    case 'importpending':base();S.data.stage='preview';S.view='data';break;
    case 'importdone':base();S.data.stage='done';S.view='data';break;
    case 'importfail':base();S.data.stage='fail';S.view='data';break;
    case 'reportgen':base();S.view='reports';S.report.sel='cur';ACT.repGen();break;
  }
  memo={};history.replaceState(null,'','#'+S.view);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  const inPop=e.target.closest('.pop');
  if(!t){if(S.pop&&!inPop){S.pop=null;render()}return}
  if(t.tagName==='A')e.preventDefault();
  if(t.tagName==='INPUT'&&t.type==='checkbox'&&!['colT','pick','pickAll','cycSel','cycAll'].includes(t.dataset.act))return;
  if(S.pop&&!inPop&&t.dataset.act!=='pop'&&t.dataset.act!=='closepop')S.pop=null;
  const fn=ACT[t.dataset.act];
  if(fn&&fn(t,e)===false)return;
  render();
});
document.addEventListener('input',e=>{
  const t=e.target, k=t.dataset.in;if(!k)return;
  if(k==='q'){S.list.q=t.value;S.list.page=1;render()}
  else if(k==='pq'){S.pq=t.value;render()}
  else if(k==='cmdq'){S.cmd.q=t.value;S.cmd.i=0;render()}
  else if(k==='fTarget')S.fdraft.target=t.value;
  else if(k==='fTerm')S.fdraft.term=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.in;if(!k)return;
  if(k==='dS'&&t.value){S.draft.s=t.value;if(S.draft.e<t.value)S.draft.e=t.value;S.draft.month=t.value.slice(0,7);render()}
  else if(k==='dE'&&t.value){S.draft.e=t.value;if(S.draft.s>t.value)S.draft.s=t.value;S.draft.month=t.value.slice(0,7);render()}
  else if(k==='failNext'){S.failNext=t.checked;toast(S.failNext?'下一次范围更新将模拟失败':'已关闭失败模拟')}
  else if(k==='ev')S.diag.event=t.value,render();
  else if(k==='wA')S.diag.wA=t.value;
  else if(k==='wB')S.diag.wB=t.value;
  else if(k==='fixS'||k==='fixE'){S.data.fix[k==='fixS'?'s':'e']=t.value;render()}
  else if(k==='rule'){const v=parseFloat(t.value);if(!isNaN(v)){S.ruleDraft[t.dataset.k]=v/(+t.dataset.mul);render()}}
  else if(k==='delOk'){S.modal.ok=t.checked;render()}
  else if(k==='file'&&t.files.length){S.data.stage='preview';toast(`已识别 ${t.files.length} 个文件（演示使用示例预览）`,'file-spreadsheet');render()}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.in==='ruleAddW'&&e.key==='Enter'&&t.value.trim()){S.ruleDraft[t.dataset.k].push(t.value.trim().toLowerCase());t.value='';render();return}
  if(t.classList&&t.classList.contains('rz')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();const id=t.dataset.rz;const w=Math.max(70,Math.min(520,(S.colW[id]||CD[id].w)+(e.key==='ArrowRight'?16:-16)));S.colW[id]=w;store.set('colW',S.colW);render();const n=document.querySelector(`.rz[data-rz="${id}"]`);if(n)n.focus();return}
  if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();S.cmd=S.cmd?null:{q:'',i:0};S.pop=null;render();return}
  if(S.cmd&&t.id==='cmdq'){const n=cmdItems(S.cmd.q).length;if(e.key==='ArrowDown'){e.preventDefault();S.cmd.i=Math.min(n-1,S.cmd.i+1);render();return}if(e.key==='ArrowUp'){e.preventDefault();S.cmd.i=Math.max(0,S.cmd.i-1);render();return}if(e.key==='Enter'){e.preventDefault();runCmd(S.cmd.i);render();return}}
  if(e.key==='Escape'&&S.cmd){S.cmd=null;render();return}
  const typing=/INPUT|TEXTAREA|SELECT/.test(t.tagName)||t.isContentEditable;
  if(!typing&&!S.modal&&!S.cmd&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
    if(e.key==='/'){e.preventDefault();S.cmd={q:'',i:0};S.pop=null;render();return}
    if(S.view==='keywords'&&['j','k','J','K','Enter','x','X'].includes(e.key)&&!t.closest('button,a')||(S.view==='keywords'&&['j','k','J','K','x','X'].includes(e.key))){
      const R=calc(S.shown);if(R&&R.kws.length){const all=listRows(R);let i=all.findIndex(x=>x.key===(S.sel||S.last));const key=e.key.toLowerCase();
        if(key==='j'||key==='k'){e.preventDefault();i=Math.max(0,Math.min(all.length-1,i<0?0:i+(key==='j'?1:-1)));const n=all[i];S.last=n.key;if(S.sel)S.sel=n.key;S.list.page=Math.floor(i/S.list.size)+1;render();const r=document.querySelector(`tr.r[data-key="${CSS.escape(n.key)}"]`);if(r)r.scrollIntoView({block:'nearest'});return}
        if(key==='enter'&&S.last){e.preventDefault();S.sel=S.last;render();return}
        if(key==='x'&&(S.sel||S.last)){e.preventDefault();const k=S.sel||S.last;S.picked.has(k)?S.picked.delete(k):S.picked.add(k);render();return}}
    }
  }
  if(e.key==='Escape'){if(S.modal){S.modal=null;render()}else if(S.pop){S.pop=null;render()}else if(S.sel){render.focusKey=S.sel;S.sel=null;render()}}
});
// 列宽拖动
let drag=null;
document.addEventListener('mousedown',e=>{const h=e.target.closest('.rz');if(!h)return;e.preventDefault();e.stopPropagation();const id=h.dataset.rz;drag={id,x:e.clientX,w:S.colW[id]||CD[id].w,h,col:document.querySelector(`col[data-col="${id}"]`),tbl:h.closest('table'),tw:parseFloat(h.closest('table').style.width)};h.classList.add('drag')});
document.addEventListener('mousemove',e=>{if(!drag)return;const w=Math.max(70,Math.min(520,drag.w+e.clientX-drag.x));drag.cw=w;drag.col.style.width=w+'px';drag.tbl.style.width=(drag.tw+w-drag.w)+'px'});
document.addEventListener('mouseup',()=>{if(!drag)return;if(drag.cw){S.colW[drag.id]=drag.cw;store.set('colW',S.colW)}drag=null;setTimeout(render,0)});
// 拖入文件
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();S.data.stage='preview';toast('已识别拖入的文件（演示使用示例预览）','file-spreadsheet');render()}});
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(render,120)});
const ROUTES=Object.keys(VIEWS);
function fromHash(){const h=location.hash.slice(1);if(ROUTES.includes(h))S.view=h}
addEventListener('hashchange',()=>{fromHash();S.pop=null;render()});
fromHash();
render();
})();
</script>
