<title>SP 广告工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
/* v3 布局：变暗的浅色导航轨（内容优先）+ 顶栏（项目 · 分析范围胶囊 · ⌘K）+ 卡片画布；关键词页「视图标签 → 工具栏 → 表格 | 详情」。
   v2 布局：深色导航轨 + 白色顶栏（项目切换 + 胶囊式分析范围）+ 浅灰画布上的卡片；关键词页是一张「表格 | 详情」工作卡。
   视觉：墨蓝导航压住画面，钴蓝只给交互和 A 期，B 期一律用灰；红绿琥珀只表达业务好坏；数字用 Barlow 等宽数字。 */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f9fafb; --sunken:#f0f2f5; --hover:#f3f5f8;
  --line:#e7eaef; --line-2:#d7dce4;
  --fg:#101828; --fg-2:#475467; --fg-3:#8a93a3;
  --accent:#2f5fef; --accent-2:#2149cf; --accent-weak:#edf2ff; --accent-line:#c3d1fc; --on-accent:#ffffff;
  --a:#2f5fef; --b:#9ba5b6; --b-weak:#eff1f5; --b-ink:#5a6476;
  --good:#0b935d; --good-weak:#e4f5ec; --bad:#dc3c37; --bad-weak:#fdeceb; --warn:#b86f00; --warn-weak:#fdf3df;
  --c1:#2f5fef; --c2:#eb6834; --c1-fill:rgba(47,95,239,.13); --band-a:#eef3ff; --band-b:#f2f4f7;
  --nav-bg:#f6f7f9; --nav-bg-2:#ffffff; --nav-fg:#667085; --nav-fg-2:#101828; --nav-line:#e7eaef; --nav-dim:#98a2b3;
  --scrim:rgba(13,20,36,.42);
  --sh-1:0 1px 2px rgba(16,24,40,.035);
  --shadow:0 4px 12px rgba(16,24,40,.07),0 18px 44px rgba(16,24,40,.16);
  --font-ui:"Geist","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"Geist","Noto Sans SC",system-ui,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail-w:224px; --detail-w:432px; --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0e16; --surface:#121824; --surface-2:#161d2b; --sunken:#0e131d; --hover:#1a2231;
  --line:#222b3b; --line-2:#2f3a4d;
  --fg:#e8ecf3; --fg-2:#a8b2c3; --fg-3:#77829a;
  --accent:#6f94ff; --accent-2:#93afff; --accent-weak:#18244a; --accent-line:#2c4382; --on-accent:#0a0f1f;
  --a:#6f94ff; --b:#6b7689; --b-weak:#1c2332; --b-ink:#a6b0c0;
  --good:#3fcb8b; --good-weak:#0f2a1f; --bad:#ff6b63; --bad-weak:#351718; --warn:#f0b14a; --warn-weak:#2f240e;
  --c1:#5b87ff; --c2:#e8692a; --c1-fill:rgba(91,135,255,.2); --band-a:rgba(111,148,255,.09); --band-b:rgba(255,255,255,.035);
  --nav-bg:#0a0e16; --nav-bg-2:#161d2b; --nav-fg:#8a95ab; --nav-fg-2:#eef2f8; --nav-line:#1c2433; --nav-dim:#5a6478;
  --scrim:rgba(0,0,0,.6);
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 4px 12px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a0e16; --surface:#121824; --surface-2:#161d2b; --sunken:#0e131d; --hover:#1a2231;
  --line:#222b3b; --line-2:#2f3a4d;
  --fg:#e8ecf3; --fg-2:#a8b2c3; --fg-3:#77829a;
  --accent:#6f94ff; --accent-2:#93afff; --accent-weak:#18244a; --accent-line:#2c4382; --on-accent:#0a0f1f;
  --a:#6f94ff; --b:#6b7689; --b-weak:#1c2332; --b-ink:#a6b0c0;
  --good:#3fcb8b; --good-weak:#0f2a1f; --bad:#ff6b63; --bad-weak:#351718; --warn:#f0b14a; --warn-weak:#2f240e;
  --c1:#5b87ff; --c2:#e8692a; --c1-fill:rgba(91,135,255,.2); --band-a:rgba(111,148,255,.09); --band-b:rgba(255,255,255,.035);
  --nav-bg:#0a0e16; --nav-bg-2:#161d2b; --nav-fg:#8a95ab; --nav-fg-2:#eef2f8; --nav-line:#1c2433; --nav-dim:#5a6478;
  --scrim:rgba(0,0,0,.6);
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 4px 12px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:6px}
svg.lucide{width:16px;height:16px;stroke-width:1.75;flex:none;vertical-align:-3px}
.num,.tn{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)} .sec{color:var(--fg-2)}
.mono{font-family:var(--font-mono);font-size:12px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- 外壳 ---------- */
#app{height:100%;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.rail{grid-row:1/3;background:var(--nav-bg);color:var(--nav-fg);display:flex;flex-direction:column;gap:18px;padding:16px 12px 14px;min-height:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 8px}
.logo{width:32px;height:32px;flex:none;display:block}
.bt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.bt b{font-weight:600;font-size:14.5px;white-space:nowrap;color:var(--nav-fg-2);letter-spacing:.01em}
.bt small{color:var(--nav-dim);font-size:11px;white-space:nowrap}
.ng{display:flex;flex-direction:column;gap:2px}
.ng.end{margin-top:auto}
.nl{font-size:11px;color:var(--nav-dim);letter-spacing:.14em;padding:4px 12px 6px}
.nav{display:flex;align-items:center;gap:11px;height:38px;padding:0 12px;border-radius:9px;color:var(--nav-fg);text-decoration:none;border:0;background:none;width:100%;text-align:left;font-size:13.5px;position:relative;transition:background .12s,color .12s}
.nav:hover{background:var(--nav-bg-2);color:var(--nav-fg-2)}
.nav.on{background:var(--nav-bg-2);color:var(--nav-fg-2);font-weight:500}
.nav.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav.on svg{color:var(--accent)}
.nav span{flex:1;white-space:nowrap}
.nav em{font-style:normal;font:600 11px var(--font-num);background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;line-height:18px;min-width:18px;text-align:center}
.rail-foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--nav-dim);padding:10px 12px 0;border-top:1px solid var(--nav-line)}
.rail-foot i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(11,147,93,.18);flex:none}

.top{grid-column:2;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px 20px;min-height:62px;position:relative;z-index:50;flex-wrap:wrap}
.main{grid-column:2;min-height:0;overflow:auto;padding:22px 24px 32px;display:flex;flex-direction:column;gap:16px}
.main.fill{overflow:hidden;padding-bottom:18px}
.tabbar{display:none}

/* ---------- 控件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none;box-shadow:0 1px 1px rgba(16,24,40,.03);transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover);border-color:var(--line-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 1px 2px rgba(47,95,239,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2);box-shadow:none}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger-o{color:var(--bad)}
.btn.sm{height:28px;padding:0 9px;font-size:12px;border-radius:7px}
.btn.icon{width:34px;padding:0}
.btn.sm.icon{width:28px}
.btn[disabled],.btn.dis{opacity:.42;cursor:not-allowed;pointer-events:none}
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px;flex:none;border:1px solid var(--line)}
.seg button{border:0;background:none;height:26px;padding:0 11px;color:var(--fg-2);font-size:12.5px;white-space:nowrap;border-radius:6px;transition:background .12s,color .12s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:0 1px 2px rgba(16,24,40,.08),0 0 0 1px var(--line)}
.inp{height:34px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);padding:0 10px;min-width:0}
.inp:focus{outline:3px solid var(--accent-weak);border-color:var(--accent)}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:10px;color:var(--fg-3);pointer-events:none}
.search .inp{padding-left:32px;width:240px;background:var(--surface-2)}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--fg-2);font-weight:500}

/* 项目切换 + 分析范围胶囊 */
.proj{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px 0 6px;border:1px solid var(--line);border-radius:11px;background:var(--surface);max-width:260px;min-width:0;transition:background .12s}
.proj:hover{background:var(--hover)}
.proj .pi{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent-weak),var(--sunken));display:grid;place-items:center;font:700 11px var(--font-num);letter-spacing:.04em;color:var(--accent);flex:none;box-shadow:inset 0 0 0 1px var(--accent-line)}
.proj .pt{display:flex;flex-direction:column;line-height:1.2;text-align:left;min-width:0}
.proj .pt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.proj .pt small{font-size:11px;color:var(--fg-3);white-space:nowrap;font-family:var(--font-mono)}
.scope{display:flex;align-items:center;gap:10px;flex:1;min-width:0;flex-wrap:wrap}
.cap{display:flex;align-items:center;gap:2px;background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:3px;min-width:0;flex-wrap:wrap}
.cap .seg{border:0;background:none;padding:0}
.cap .seg button[aria-pressed="true"]{box-shadow:0 1px 2px rgba(16,24,40,.1)}
.cap-sep{width:1px;height:20px;background:var(--line-2);margin:0 4px;flex:none}
.scope .vs{font-size:11px;color:var(--fg-3);padding:0 2px;font-weight:500}
.vsep{width:1px;height:24px;background:var(--line);flex:none}
.rng{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 9px 0 6px;border:0;border-radius:8px;background:transparent;white-space:nowrap;position:relative;transition:background .12s;font-size:13px}
.rng:hover{background:var(--surface);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.rng .rv{font-variant-numeric:tabular-nums;font-weight:600;font-family:var(--font-num);font-size:14px;letter-spacing:.01em}
.rng .rd{font-size:11.5px;color:var(--fg-3)}
.rng .rd.warn{color:var(--warn);font-weight:500}
.rng.pending::after{content:"";position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--warn);border:2px solid var(--sunken)}
.ab{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:5px;font:700 10.5px var(--font-num);padding:0 4px;letter-spacing:.02em}
.ab.a{background:var(--a);color:var(--on-accent)}
.ab.b{background:var(--surface);color:var(--b-ink);box-shadow:inset 0 0 0 1.5px var(--b)}
.fbtn{font-weight:500;color:var(--fg-2)}
.fbtn em{font-style:normal;background:var(--accent);color:var(--on-accent);border-radius:9px;font:600 11px var(--font-num);padding:0 6px;line-height:17px}
.status{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;font-size:12px;white-space:nowrap;background:var(--sunken);color:var(--fg-2);font-weight:500}
.status.ok{background:var(--good-weak);color:var(--good)}
.status.busy{background:var(--accent-weak);color:var(--accent)}
.status.err{background:var(--bad-weak);color:var(--bad)}
.status.pend{background:var(--warn-weak);color:var(--warn)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.topr{display:flex;align-items:center;gap:8px;margin-left:auto}
.asof{font-size:12px;color:var(--fg-3);white-space:nowrap}
.scope-sum{display:none}

/* 弹层 */
.pa{position:relative;display:inline-flex}
.pop{position:absolute;top:calc(100% + 8px);left:0;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:240px;max-height:min(80vh,660px);overflow:auto;animation:popin .14s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pop.right{left:auto;right:0}
.pop-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px}
.pop-b{padding:14px 16px}
.pop-f{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:11px 16px;border-top:1px solid var(--line);background:var(--surface-2);position:sticky;bottom:0}
.pop-f .grow{flex:1;font-size:12px;color:var(--fg-2);min-width:0}
.plist{padding:6px}
.pitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:9px}
.pitem:hover{background:var(--hover)}
.pitem.on{background:var(--accent-weak)}
.pitem .pt{display:flex;flex-direction:column;min-width:0;flex:1}
.pitem small{color:var(--fg-3);font-size:11.5px}

/* 日期弹层 */
.dp{display:grid;grid-template-columns:156px 278px 172px;width:min(608px,94vw)}
.dp-pre{border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:1px;background:var(--surface-2)}
.dp-pre h5,.dp-wk h5{margin:8px 8px 3px;font-size:11px;font-weight:500;color:var(--fg-3);letter-spacing:.1em}
.dp-pre button,.dp-wk button{border:0;background:none;text-align:left;padding:6px 9px;border-radius:7px;font-size:12.5px;color:var(--fg-2);display:flex;justify-content:space-between;gap:6px}
.dp-pre button:hover,.dp-wk button:hover{background:var(--hover);color:var(--fg)}
.dp-pre button.on,.dp-wk button.on{background:var(--accent-weak);color:var(--accent);font-weight:500}
.dp-cal{padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px 0}
.cal .wd{font-size:11px;color:var(--fg-3);text-align:center;padding:2px 0}
.cd{height:32px;border:0;background:none;font:500 13px var(--font-num);font-variant-numeric:tabular-nums;position:relative;color:var(--fg)}
.cd:hover{background:var(--hover);border-radius:7px}
.cd.in{background:var(--accent-weak)}
.cd.st,.cd.en{background:var(--accent);color:var(--on-accent);font-weight:700}
.cd.st{border-radius:8px 0 0 8px}.cd.en{border-radius:0 8px 8px 0}.cd.st.en{border-radius:8px}
.cd.out{color:var(--fg-3);opacity:.5}
.cd.miss{color:var(--bad);text-decoration:line-through}
.cd.op::after{content:"";position:absolute;left:22%;right:22%;bottom:3px;height:2px;border-radius:1px;background:var(--b)}
.cd.lastday::before{content:"";position:absolute;top:4px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--good)}
.cal-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--fg-3)}
.cal-legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:2px;margin-right:4px}
.dp-in{display:flex;align-items:center;gap:6px}
.dp-in .inp{width:100%;height:30px;font-size:12px;padding:0 6px}
.dp-wk{border-left:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:1px;max-height:430px;overflow:auto}
.dp-wk button span{font-family:var(--font-num);font-weight:600}
.dp-wk button small{color:var(--fg-3);font-size:11px;font-family:var(--font-num)}
.dp-note{grid-column:1/-1;border-top:1px solid var(--line);padding:9px 16px;font-size:11.5px;color:var(--fg-2);background:var(--surface-2)}

/* 筛选弹层 */
.fp{width:min(580px,94vw)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .full{grid-column:1/-1}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);font-size:12px;color:var(--fg-2);max-width:100%;transition:all .12s}
.chk:hover{border-color:var(--accent-line)}
.chk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk.on{background:var(--accent-weak);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.chk svg{width:13px;height:13px}
.fsec{display:flex;flex-direction:column;gap:7px}
.fsec>b{font-size:12px;font-weight:600;color:var(--fg-2)}

/* ---------- 页面部件 ---------- */
.ph{display:flex;align-items:flex-end;gap:10px 16px;flex-wrap:wrap}
.ph .tt{display:flex;flex-direction:column;gap:3px;min-width:0}
.ph h1{font-size:21px;font-weight:600;margin:0;letter-spacing:.01em;white-space:nowrap;line-height:1.25}
.ph .meta{color:var(--fg-3);font-size:12.5px;min-width:0}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--sh-1)}
.panel-h{display:flex;align-items:center;gap:8px 10px;padding:16px 18px 0;flex-wrap:wrap}
.panel-h h3{margin:0;font-size:14.5px;font-weight:600}
.panel-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.panel-b{padding:12px 18px 18px}
.cols2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);gap:16px}
.cols2e{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.newb{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;border:1px dashed var(--warn);color:var(--warn);font-size:10.5px;font-weight:600;letter-spacing:.06em;white-space:nowrap}

/* 横幅 */
.bn{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:11px;font-size:12.5px;border:1px solid}
.bn>svg{margin-top:2px}
.bn .bt2{flex:1;min-width:0;line-height:1.6}
.bn .ba{display:flex;gap:6px;flex:none}
.bn.info{background:var(--surface);border-color:var(--line);color:var(--fg-2)}
.bn.info>svg{color:var(--warn)}
.bn.warn{background:var(--warn-weak);border-color:transparent;color:var(--fg)}
.bn.warn>svg{color:var(--warn)}
.bn.err{background:var(--bad-weak);border-color:transparent;color:var(--fg)}
.bn.err>svg{color:var(--bad)}
.bn.busy{background:var(--accent-weak);border-color:transparent;color:var(--fg)}
.bn.busy>svg{color:var(--accent)}

/* KPI 卡 */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 16px 0;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden}
.kpi .kl{font-size:12.5px;color:var(--fg-2);display:flex;align-items:center;gap:8px;font-weight:500}
.kic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--accent-weak);color:var(--accent);flex:none}
.kic svg{width:14px;height:14px}
.kpi .kv{font:600 28px/1.15 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.005em;margin-top:6px}
.kpi .kb{font-size:11.5px;color:var(--fg-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:22px}
.kpi .kbs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{display:block;width:calc(100% + 32px);height:38px;margin:6px -16px 0}
.kcap{display:flex;justify-content:flex-end;gap:14px;font-size:11.5px;color:var(--fg-3);margin-top:-6px}
.kcap span{display:inline-flex;gap:6px;align-items:center}
.d{display:inline-flex;align-items:center;gap:2px;height:20px;padding:0 6px;border-radius:6px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--font-num)}
.d svg{width:12px;height:12px;stroke-width:2.2}
.d.good{color:var(--good);background:var(--good-weak)}
.d.bad{color:var(--bad);background:var(--bad-weak)}
.d.neu{color:var(--fg-2);background:var(--sunken)}
.d.flat,.d.na2{color:var(--fg-3);font-weight:500;background:none;padding:0}
.na{color:var(--fg-3)}
.nobase{color:var(--fg-3);font-style:italic;font-size:11.5px}

/* 图表 */
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart .ax{fill:var(--fg-3);font-size:11px;font-family:var(--font-num)}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .base{stroke:var(--line-2)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:9px 12px;font-size:12px;min-width:164px;z-index:5;white-space:nowrap}
.tip b{display:block;margin-bottom:5px;font-weight:600}
.tip .tr{display:flex;align-items:center;gap:10px;justify-content:space-between;line-height:1.75}
.tip .tr span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--fg-2)}
.tip .tr span:last-child{font-family:var(--font-num);font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--fg-2);align-items:center;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ln{display:inline-block;width:16px;height:2.5px;border-radius:2px}
.ln.dash{background:repeating-linear-gradient(90deg,var(--b) 0 4px,transparent 4px 7px)!important}
.trend-panel{display:flex;flex-direction:column}
.trend-panel .panel-b{flex:1;display:flex;flex-direction:column;min-height:0}
.trend-panel .chart{flex:1;min-height:300px}

/* 待处理队列 */
.q{display:flex;flex-direction:column;gap:2px}
.qg{font-size:11px;color:var(--fg-3);letter-spacing:.14em;padding:12px 4px 6px;font-weight:500}
.qi{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:9px 8px;border:0;background:none;text-align:left;width:100%;border-radius:10px;transition:background .12s}
.qi:hover{background:var(--hover)}
.qi:hover>svg{color:var(--fg);transform:translateX(2px)}
.qi>svg{color:var(--fg-3);transition:transform .12s}
.qic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.qic svg{width:17px;height:17px}
.qic.risk{background:var(--bad-weak);color:var(--bad)}
.qic.opp{background:var(--good-weak);color:var(--good)}
.qic.warn{background:var(--warn-weak);color:var(--warn)}
.qic.idle{background:var(--sunken);color:var(--fg-3)}
.qi .qt{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.qi .qt b{font-weight:600}
.qi .qt small{color:var(--fg-3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi .qr{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.qi .qn{font:600 20px var(--font-num);font-variant-numeric:tabular-nums}
.qi .qm{font-size:11.5px;color:var(--fg-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.qi.static{cursor:default}
.qi.static:hover{background:none}

/* 标签 */
.tags{display:flex;gap:4px;flex-wrap:nowrap;min-width:0;overflow:hidden}
.tags.wrap{flex-wrap:wrap;overflow:visible}
.tag{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:11px;font-size:11.5px;white-space:nowrap;flex:none;font-weight:500}
.tag.risk{background:var(--bad-weak);color:var(--bad)}
.tag.opp{background:var(--good-weak);color:var(--good)}
.tag.chg{background:var(--accent-weak);color:var(--accent)}
.tag.obs{background:transparent;color:var(--fg-3);box-shadow:inset 0 0 0 1px var(--line-2);font-weight:400}
.tag.warn{background:var(--warn-weak);color:var(--warn)}
.tag.more{background:var(--sunken);color:var(--fg-2)}
.pri{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pri.hi{background:var(--bad-weak);color:var(--bad)}
.pri.mid{background:var(--warn-weak);color:var(--warn)}
.pri.lo{background:var(--sunken);color:var(--fg-2)}

/* ---------- 关键词工作卡 ---------- */
.kw{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden;position:relative}
.kw.open{grid-template-columns:minmax(0,1fr) var(--detail-w)}
.kwm{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface)}
.tb{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tb.chips{gap:4px 4px;padding:10px 14px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;background:var(--surface-2)}
.tb .sp{flex:1}
.tchip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:8px;border:1px solid transparent;background:none;font-size:12.5px;color:var(--fg-2);white-space:nowrap;flex:none;transition:background .12s}
.tchip:hover{background:var(--surface);border-color:var(--line)}
.tchip b{font:600 12px var(--font-num);color:var(--fg-3)}
.tchip .dot{width:7px;height:7px;border-radius:50%}
.tchip.on{background:var(--surface);border-color:var(--accent-line);color:var(--accent);font-weight:500;box-shadow:0 1px 2px rgba(47,95,239,.12)}
.tchip.on b{color:var(--accent)}
.tchip.x{border-color:var(--accent-line);background:var(--accent-weak);color:var(--accent)}
.tgl{font-size:11px;color:var(--fg-3);padding:0 2px 0 10px;flex:none;letter-spacing:.1em}
.tbl-wrap{flex:1;min-height:0;overflow:auto;position:relative;background:var(--surface)}
.tbl-wrap.stale table{opacity:.45;filter:saturate(.4)}
table.g{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px}
table.g th{position:sticky;top:0;z-index:2;background:var(--surface-2);height:40px;padding:0 12px;text-align:left;font-weight:500;font-size:12px;color:var(--fg-3);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;cursor:pointer}
table.g th.ca{background:var(--accent-weak);box-shadow:inset 0 2px 0 var(--a);color:var(--fg-2)}
table.g th.cb{background:var(--b-weak);box-shadow:inset 0 2px 0 var(--b)}
table.g th:hover{color:var(--fg)}
table.g th.num,table.g td.num{text-align:right}
table.g th .thc{display:inline-flex;align-items:center;gap:5px;max-width:100%}
table.g th.num .thc{justify-content:flex-end}
table.g th svg{width:13px;height:13px}
table.g th.sorted{color:var(--accent)}
.rz{position:absolute;top:0;right:0;width:9px;height:100%;cursor:col-resize;z-index:3;display:block}
.rz::after{content:"";position:absolute;top:10px;bottom:10px;right:3px;width:2px;border-radius:1px;background:transparent}
th:hover .rz::after,.rz:focus-visible::after,.rz.drag::after{background:var(--accent-line)}
table.g td{height:48px;padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface)}
table.g td.num{font-family:var(--font-num);font-size:13.5px;font-variant-numeric:tabular-nums;font-weight:500}
table.g td.bcol{color:var(--fg-3);font-weight:400}
table.g td.hi-acos{color:var(--bad);font-weight:600}
table.g td.lo-acos{color:var(--good);font-weight:600}
table.g tr.r:hover td{background:var(--hover)}
table.g tr.r.sel td{background:var(--accent-weak)}
table.g tr.r.last td.kwc{box-shadow:inset 3px 0 0 var(--accent-line)}
table.g tr.r.sel td.kwc{box-shadow:inset 3px 0 0 var(--accent)}
table.g .kwc{position:sticky;left:0;z-index:1;border-right:1px solid var(--line)}
table.g th.kwc{z-index:4}
.nbw{position:relative;display:inline-block;min-width:60px}
.nbw i{position:absolute;right:0;bottom:-7px;height:3px;border-radius:2px;background:var(--accent-line)}
.kwcell{display:flex;align-items:center;gap:6px;min-width:0}
.exp{width:24px;height:24px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--fg-3);flex:none;padding:0}
.exp:hover{background:var(--sunken);color:var(--fg)}
.exp svg{transition:transform .15s}
.exp[aria-expanded="true"]{background:var(--accent-weak)}
.exp[aria-expanded="true"] svg{transform:rotate(90deg);color:var(--accent)}
.kwn{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.35}
.kwn .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg);font-size:13px}
.kwn:hover .t{color:var(--accent)}
.kwn small{font-size:11px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kwn small .wv{color:var(--warn);font-weight:500}
.sugg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500}
.sugg i.dotp{display:inline-block;width:7px;height:7px;border-radius:50%}
tr.sub>td{padding:0!important;height:auto!important;background:var(--surface-2)!important;border-bottom:1px solid var(--line-2)}
.subw{position:sticky;left:0;width:var(--wrapw,960px);max-width:100%;padding:12px 16px 14px 46px;white-space:normal}
.subh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2);margin-bottom:8px;flex-wrap:wrap}
.subh b{color:var(--fg);font-weight:600}
.subsc{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.st{border-collapse:collapse;width:100%;min-width:1060px;font-size:12px}
table.st th{font-weight:500;color:var(--fg-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
table.st td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
table.st td.num{font-family:var(--font-num);font-size:12.5px}
table.st th.num,table.st td.num{text-align:right}
table.st tr:last-child td{border-bottom:0}
table.st tfoot td{background:var(--surface-2);font-weight:600}
table.st .cn{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--good);display:inline-flex;align-items:center;gap:4px}
.ft{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--fg-2);background:var(--surface-2);flex-wrap:wrap}
.ft .sp{flex:1}
.pg{display:flex;gap:2px;align-items:center}
.pg button{min-width:30px;height:28px;border:1px solid transparent;background:none;border-radius:7px;font:500 12.5px var(--font-num);font-variant-numeric:tabular-nums;color:var(--fg-2)}
.pg button:hover{background:var(--surface);border-color:var(--line)}
.pg button.on{border-color:var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600}
.pg button[disabled]{opacity:.35;cursor:default}
.empty-row{padding:52px 16px;text-align:center;color:var(--fg-2)}

/* 列设置 / 导出 */
.colp{width:340px}
.colg{font-size:11px;color:var(--fg-3);letter-spacing:.1em;padding:10px 16px 4px}
.coli{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 16px}
.coli:hover{background:var(--hover)}
.coli label{flex:1;display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;min-width:0;padding:4px 0}
.coli input{accent-color:var(--accent);margin:0}
.coli .mv{opacity:0}
.coli:hover .mv,.coli .mv:focus-visible{opacity:1}
.coli.lock label{color:var(--fg-3);cursor:default}
.exp-p{width:370px}
.kv-list{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.5px;margin:0}
.kv-list dt{color:var(--fg-3)}
.kv-list dd{margin:0;min-width:0}

/* 详情侧栏 */
.det{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;min-width:0}
.det-h{padding:14px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,var(--accent-weak),var(--surface) 85%)}
.det-top{display:flex;align-items:center;gap:6px}
.det-top .pos{font:500 12px var(--font-num);color:var(--fg-3);margin-right:2px}
.det h2{margin:0;font-size:18px;font-weight:600;line-height:1.35;word-break:break-word;text-wrap:balance}
.det .ctx{font-size:12px;color:var(--fg-2)}
.det-b{flex:1;overflow:auto;padding:2px 18px 18px;display:flex;flex-direction:column}
.det-s{padding:16px 0;border-bottom:1px solid var(--line)}
.det-s:last-child{border-bottom:0}
.det-s>h4{margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--fg);display:flex;align-items:center;gap:7px}
.det-s>h4 svg{color:var(--fg-3)}
.det-s>h4 .r{margin-left:auto;font-weight:400;color:var(--fg-3);font-size:11.5px}
.det-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.mcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mc .mcl{font-size:11.5px;color:var(--fg-3)}
.mc .mcv{font:600 19px/1.2 var(--font-num);font-variant-numeric:tabular-nums}
.mc .mcb{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-3);font-family:var(--font-num)}
.pbar{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.pbar i{display:block;height:4px;border-radius:2px;background:var(--a);min-width:2px}
.pbar i.b{background:var(--b);opacity:.7}
details.allm{margin-top:10px}
details.allm summary{cursor:pointer;font-size:12px;color:var(--accent);list-style:none;display:inline-flex;align-items:center;gap:4px}
details.allm summary::-webkit-details-marker{display:none}
details.allm[open] summary svg{transform:rotate(90deg)}
.sg{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.sg+.sg{margin-top:10px}
.sg-h{display:flex;align-items:center;gap:10px}
.sgi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.sgi.risk{background:var(--bad-weak);color:var(--bad)}
.sgi.opp{background:var(--good-weak);color:var(--good)}
.sg-h b{font-size:14px}
.sg-h .muted{font-size:11.5px}
.sg-h .pri{margin-left:auto}
.sg-o{font-size:12px;color:var(--fg-2);display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;background:var(--surface-2);border-radius:7px;padding:6px 9px}
.sg-o svg{width:12px;height:12px;color:var(--fg-3)}
.ev{display:grid;grid-template-columns:58px minmax(0,1fr);gap:6px 8px;margin:0;font-size:12px}
.ev dt{color:var(--fg-3);font-size:11.5px;padding-top:1px}
.ev dd{margin:0;min-width:0;line-height:1.55}
.ev ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.ev li{display:flex;gap:6px;align-items:flex-start}
.ev li svg{width:13px;height:13px;color:var(--bad);margin-top:3px}
.ev li.opp svg{color:var(--good)}
table.mt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.mt th{font-weight:500;color:var(--fg-3);text-align:right;padding:4px 6px;font-size:11.5px}
table.mt th:first-child{text-align:left}
table.mt td{padding:6px;border-top:1px solid var(--line);text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
table.mt td:first-child{text-align:left;color:var(--fg-2);font-family:var(--font-ui)}
table.mt td.bv{color:var(--fg-3)}
.hist{display:grid;grid-template-columns:44px 1fr;gap:8px 10px;align-items:end;font-size:11.5px;color:var(--fg-3)}
.bars{display:flex;align-items:flex-end;gap:3px;height:44px}
.bars i{flex:1;background:var(--c1);border-radius:3px 3px 1px 1px;min-height:2px;position:relative;opacity:.85}
.bars i:last-child{opacity:1}
.bars i.zero{background:var(--line-2)}
.bars.o i{background:var(--c2)}
.bars.o i.zero{background:var(--line-2)}
.src-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:12px}
.src-row:first-of-type{border-top:0}
.src-row .sn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-row .sm{color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-row .sv{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.human{display:flex;flex-wrap:wrap;gap:6px}
.human span{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;background:var(--sunken);font-size:12px;color:var(--fg-2)}
.hint2{font-size:11.5px;color:var(--fg-3);line-height:1.5;font-weight:400}

/* ---------- 变化诊断 ---------- */
.mode{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--sh-1)}
.mode .hint{font-size:12px;color:var(--fg-3)}
.mode .btn .ab{margin-right:2px}
table.ct{width:100%;border-collapse:collapse;font-size:13px}
table.ct th{font-weight:500;color:var(--fg-3);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
table.ct th:first-child,table.ct td:first-child{text-align:left}
table.ct td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--font-num);font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
table.ct td:first-child{font-family:var(--font-ui);font-size:13px}
table.ct td.bv{color:var(--fg-3);font-weight:400}
table.ct tbody tr:hover td{background:var(--surface-2)}
table.ct tbody tr:last-child td{border-bottom:0}
.div-list{display:flex;flex-direction:column;gap:2px}
.dv{display:grid;grid-template-columns:minmax(0,150px) 1fr 76px;gap:10px;align-items:center;padding:6px 6px;border:0;background:none;text-align:left;border-radius:8px;font-size:12.5px}
.dv:hover{background:var(--hover)}
.dv .dl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv .dtrack{position:relative;height:16px}
.dv .dtrack::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line-2)}
.dv .dbar{position:absolute;top:2px;height:12px}
.dv .dbar.pos{left:50%;background:var(--c1);border-radius:0 4px 4px 0}
.dv .dbar.neg{right:50%;background:var(--c2);border-radius:4px 0 0 4px}
.dv .dval{text-align:right;font:600 13px var(--font-num);font-variant-numeric:tabular-nums}
.sm4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.smc h5{margin:0 0 4px;font-size:12px;font-weight:500;color:var(--fg-2);display:flex;justify-content:space-between;gap:6px}
.smc h5 .tn{font:600 14px var(--font-num);color:var(--fg)}
details.cov{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
details.cov summary{cursor:pointer;padding:13px 18px;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
details.cov summary::-webkit-details-marker{display:none}
details.cov summary svg.chev{transition:transform .15s}
details.cov[open] summary svg.chev{transform:rotate(90deg)}
details.cov .cv-b{padding:0 18px 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 24px;font-size:12.5px;color:var(--fg-2)}
details.cov .cv-b h6{margin:0 0 4px;font-size:12.5px;color:var(--fg);font-weight:600}
details.cov .cv-b p{margin:0;line-height:1.6}

/* ---------- 数据中心 ---------- */
.steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12px}
.step{display:inline-flex;align-items:center;gap:6px;color:var(--fg-3);padding:0 2px}
.step i.n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);font:700 11px var(--font-num);font-style:normal}
.step.done{color:var(--fg-2)} .step.done i.n{background:var(--good-weak);border-color:transparent;color:var(--good)}
.step.cur{color:var(--accent);font-weight:600} .step.cur i.n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step+.step::before{content:"";width:18px;height:1px;background:var(--line-2);margin-right:4px}
.drop{border:1.5px dashed var(--line-2);border-radius:12px;padding:24px;display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap;background:var(--surface-2);text-align:center;transition:all .12s}
.drop.over{border-color:var(--accent);background:var(--accent-weak)}
.drop .ei{width:44px;height:44px;border-radius:12px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center}
.drop .ei svg{width:22px;height:22px}
.file{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:start;margin-top:10px}
.file .fi{width:34px;height:34px;border-radius:9px;background:var(--good-weak);display:grid;place-items:center;color:var(--good)}
.file .fi.q{background:var(--warn-weak);color:var(--warn)}
.file .fn{font-weight:600;word-break:break-all}
.file .fm{font-size:12px;color:var(--fg-2);display:flex;flex-wrap:wrap;gap:4px 14px}
.cnts{display:flex;gap:6px;flex-wrap:wrap;grid-column:2/-1}
.cnt{display:inline-flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:8px;background:var(--sunken);font-size:12px;color:var(--fg-2)}
.cnt b{font:600 14px var(--font-num);font-variant-numeric:tabular-nums;color:var(--fg)}
.cnt.add{background:var(--good-weak)} .cnt.add b{color:var(--good)}
.cnt.upd{background:var(--accent-weak)} .cnt.upd b{color:var(--accent)}
.cnt.rej{background:var(--bad-weak)} .cnt.rej b{color:var(--bad)}
.rej-list{grid-column:2/-1;font-size:12px;color:var(--fg-2);background:var(--surface-2);border-radius:8px;padding:7px 12px 7px 26px;margin:0}
.rej-list li{margin:2px 0}
.covg{display:grid;grid-template-columns:80px minmax(0,1fr);gap:8px 12px;align-items:center;font-size:12px}
.covrow{display:grid;grid-template-columns:repeat(108,minmax(0,1fr));gap:2px;height:22px}
.covrow i{background:var(--c1);border-radius:2px;opacity:.8}
.covrow i.no{background:var(--bad-weak);box-shadow:inset 0 0 0 1.5px var(--bad);opacity:1}
.covrow i.none{background:var(--sunken);opacity:1}
.covax{display:flex;justify-content:space-between;color:var(--fg-3);font:500 11px var(--font-num);grid-column:2}
table.lt{width:100%;border-collapse:collapse;font-size:12.5px;min-width:980px}
table.lt th{font-weight:500;color:var(--fg-3);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);font-size:12px}
table.lt th:first-child{border-radius:8px 0 0 0}
table.lt th:last-child{border-radius:0 8px 0 0}
table.lt td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
table.lt td.num{font-family:var(--font-num);font-size:13px;font-weight:500}
table.lt th.num,table.lt td.num{text-align:right}
table.lt tbody tr:hover td{background:var(--hover)}
table.lt tbody tr:last-child td{border-bottom:0}
.scx{overflow-x:auto}
.st-pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500}
.st-pill.ok{color:var(--good)} .st-pill.w{color:var(--warn)}

/* ---------- 复盘报告 ---------- */
.rep{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.rh{display:flex;flex-direction:column;padding-bottom:6px}
.rh>button{border:0;background:none;text-align:left;padding:10px 12px;margin:0 6px;display:flex;flex-direction:column;gap:4px;border-radius:9px}
.rh>button:hover{background:var(--hover)}
.rh>button.on{background:var(--accent-weak)}
.rh>button b{font-weight:600}
.rh small{color:var(--fg-3);font-size:11.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-family:var(--font-num)}
.srcb{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:600;background:var(--sunken);color:var(--fg-2);font-family:var(--font-ui)}
.srcb.ai{background:var(--accent-weak);color:var(--accent)}
.rgen{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.rmeta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);align-items:center}
.md{padding:10px 40px 36px;max-width:820px;margin:0 auto;line-height:1.75;font-size:13.5px}
.md h1{font-size:22px;margin:22px 0 8px;text-wrap:balance;line-height:1.35}
.md h2{font-size:15.5px;margin:26px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
.md blockquote{margin:8px 0 12px;padding:8px 14px;border-left:3px solid var(--accent);color:var(--fg-2);font-size:12.5px;background:var(--surface-2);border-radius:0 8px 8px 0}
.md table{border-collapse:collapse;font-size:13px;margin:8px 0;min-width:440px}
.md th,.md td{border-bottom:1px solid var(--line);padding:7px 18px 7px 0;text-align:left;font-variant-numeric:tabular-nums}
.md td{font-family:var(--font-num)}
.md td:first-child{font-family:var(--font-ui)}
.md th{color:var(--fg-3);font-weight:500;font-size:12px}
.md ul{padding-left:20px;margin:6px 0}
.md li{margin:3px 0}
.md code{font-family:var(--font-mono);font-size:12px;background:var(--sunken);padding:1px 5px;border-radius:4px}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--sunken),var(--hover),var(--sunken));background-size:200% 100%;animation:sh 1.2s infinite;margin:14px 0}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- 项目 / 规则 ---------- */
.cov-bar{position:relative;height:6px;background:var(--sunken);border-radius:3px;width:150px}
.cov-bar i{position:absolute;top:0;bottom:0;background:var(--c1);border-radius:3px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 18px}
.unit{position:relative;display:flex;align-items:center}
.unit .inp{width:100%;padding-right:34px;font-family:var(--font-num);font-size:14px;font-weight:600}
.unit em{position:absolute;right:11px;font-style:normal;color:var(--fg-3);font-size:12px}
.switch{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:10px;background:var(--surface-2)}
.sw-btn{width:38px;height:22px;border-radius:11px;border:0;background:var(--line-2);position:relative;flex:none;margin-top:1px}
.sw-btn::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw-btn[aria-checked="true"]{background:var(--accent)}
.sw-btn[aria-checked="true"]::after{left:19px}
.tagin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:9px;padding:6px 7px;background:var(--surface);min-height:38px}
.tagin span{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 9px;border-radius:12px;background:var(--accent-weak);color:var(--accent);font-size:12px;font-weight:500}
.tagin span button{border:0;background:none;padding:0;width:16px;height:16px;display:grid;place-items:center;color:inherit;opacity:.7}
.tagin span button svg{width:12px;height:12px}
.tagin input{border:0;background:none;flex:1;min-width:100px;height:24px;outline:none;font-size:12px}
.ai-st{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:13px;background:var(--warn-weak);color:var(--warn);font-weight:500}
.ai-st.ok{background:var(--good-weak);color:var(--good)}

/* ---------- 方案说明 ---------- */
.spec{max-width:1100px;display:flex;flex-direction:column;gap:16px}
.spec h2{font-size:15px;margin:0}
.spec p,.spec li{color:var(--fg-2);line-height:1.7}
.spec ul{margin:6px 0;padding-left:18px}
.dir{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dir .panel{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.dir .panel.rec{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-weak)}
.dir h3{margin:0;font-size:14.5px;display:flex;align-items:center;gap:8px}
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12.5px}
.flow span{padding:6px 11px;border-radius:8px;background:var(--sunken);color:var(--fg)}
.flow span.k{background:var(--accent-weak);color:var(--accent);font-weight:500}
.flow svg{color:var(--fg-3)}
table.sp{width:100%;border-collapse:collapse;font-size:12.5px}
table.sp th{text-align:left;font-weight:500;color:var(--fg-3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.sp td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--fg-2);line-height:1.6}
table.sp td:first-child{color:var(--fg);font-weight:600;white-space:nowrap}
table.sp tbody tr:last-child td{border-bottom:0}
.prio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.prio .panel{padding:14px 16px}
.prio h4{margin:0 0 6px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.prio .lv{font:700 11px var(--font-num);padding:2px 7px;border-radius:5px;background:var(--fg);color:var(--surface)}

/* ---------- 空状态 / 错误 ---------- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:56px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.empty .ei{width:56px;height:56px;border-radius:16px;background:var(--accent-weak);display:grid;place-items:center;color:var(--accent);box-shadow:0 0 0 8px color-mix(in srgb,var(--accent-weak) 45%,transparent)}
.empty .ei svg{width:26px;height:26px}
.empty h3{margin:6px 0 0;font-size:16px}
.empty p{margin:0;color:var(--fg-2);max-width:480px;line-height:1.65}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.howto{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--fg-2)}
.howto span{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line)}

/* 弹窗 / 底部面板 / 提示 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;display:grid;place-items:center;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(520px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line);animation:popin .16s ease-out}
.modal.wide{width:min(760px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:15.5px;flex:1}
.modal-b{padding:16px 20px;display:flex;flex-direction:column;gap:12px;font-size:13px;color:var(--fg-2)}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:13px 20px;border-top:1px solid var(--line);background:var(--surface-2)}
.conseq{background:var(--bad-weak);border-radius:10px;padding:12px 14px;color:var(--fg)}
.conseq ul{margin:4px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--nav-bg);color:var(--nav-fg-2);padding:10px 16px;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 32px);animation:popin .16s ease-out}
.toast svg{color:var(--good)}

/* ---------- 1024 小桌面 ---------- */
@media (max-width:1279px){
  :root{--rail-w:64px}
  .rail{padding:14px 10px;align-items:stretch}
  .bt,.nl,.nav span,.rail-foot{display:none}
  .nav em{position:absolute;top:3px;right:3px;font-size:10px;line-height:15px;padding:0 4px;min-width:15px}
  .brand{justify-content:center;padding:2px 0 6px}
  .nav{justify-content:center;padding:0}
  .nav.on::before{left:-10px}
  .rng .rd,.status .stx{display:none}
  .kw.open{grid-template-columns:minmax(0,1fr)}
  .kw.open .det{position:absolute;top:0;right:0;bottom:0;width:min(var(--detail-w),92%);z-index:30;box-shadow:var(--shadow)}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols2{grid-template-columns:minmax(0,1fr)}
  .sm4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rep{grid-template-columns:230px minmax(0,1fr)}
  .main{padding:18px 20px 28px}
}
@media (max-width:1100px){ .asof{display:none} }

/* ---------- 390 手机 ---------- */
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{display:none}
  .top,.main{grid-column:1}
  .top{padding:8px 16px;gap:8px;flex-wrap:nowrap;min-height:58px}
  .proj{max-width:none;flex:1;height:40px}
  .scope,.topr .asof,.topr .hl,.vsep{display:none}
  .scope-sum{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 11px;border:1px solid var(--line);border-radius:11px;background:var(--sunken);font:600 13px var(--font-num);white-space:nowrap;flex:none;position:relative}
  .scope-sum.pending::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
  .main{padding:14px 16px calc(80px + env(safe-area-inset-bottom,0px))}
  .main.fill{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:5px max(8px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(16,24,40,.06)}
  .tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;font-size:10.5px;color:var(--fg-3);text-decoration:none;border:0;background:none;border-radius:10px}
  .tabbar svg.lucide{width:20px;height:20px}
  .tabbar .on{color:var(--accent);font-weight:600}
  .pop,.pop.right{position:fixed;left:0;right:0;top:auto;bottom:0;width:auto!important;max-height:86vh;border-radius:18px 18px 0 0;z-index:85;padding-bottom:env(safe-area-inset-bottom,0px)}
  .pop-scrim{position:fixed;inset:0;background:var(--scrim);z-index:84}
  .dp{grid-template-columns:1fr;width:auto}
  .dp-pre{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap}
  .dp-pre h5{width:100%}
  .dp-wk{border-left:0;border-top:1px solid var(--line);max-height:160px}
  .fgrid{grid-template-columns:1fr}
  .ph h1{font-size:18px}
  .ph .act{margin-left:0;width:100%}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px 13px 0}
  .kpi .kv{font-size:23px}
  .spark{width:calc(100% + 26px);margin:4px -13px 0}
  .cols2e,.dir,.prio,.rep{grid-template-columns:minmax(0,1fr)}
  .sm4{grid-template-columns:minmax(0,1fr)}
  details.cov .cv-b{grid-template-columns:1fr}
  .search .inp{width:100%}
  .search{flex:1}
  .tb .hide-m{display:none}
  .kw.open .det{position:fixed;inset:0;width:auto;z-index:70;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .subw{padding-left:16px}
  .ft{gap:6px}
  .ft .hide-m{display:none}
  .dv{grid-template-columns:minmax(0,110px) 1fr 64px}
  .md{padding:6px 18px 26px}
}

.rng.dis,.seg.dis{opacity:.42;pointer-events:none}
.kw.open .tb .hide-m{display:none}
.kw.open .search .inp{width:200px}
@media (max-width:760px){.top>.pa:first-child{flex:1;min-width:0}.top>.pa:first-child .proj{width:100%}.scope-sum .ab{display:none}}

.hi-acos{color:var(--bad)!important;font-weight:600}
.lo-acos{color:var(--good)!important;font-weight:600}

/* ---------- v3：借鉴 Linear（主次权重、变暗导航、紧凑标签）、Stripe（指标卡驱动主图）、Polaris（视图标签、批量操作）、Google Ads（按影响排序的建议与处理进度） ---------- */
.rail{border-right:1px solid var(--nav-line)}
.nav{height:34px;font-size:13px}
.nav.on{box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(16,24,40,.05)}
.nav.on::before{display:none}
.nav em{background:var(--bad-weak);color:var(--bad)}
.nl{letter-spacing:.08em}
.ph h1{font-size:20px;letter-spacing:-.015em}
.panel-h h3{font-size:14px;letter-spacing:-.005em}
.kpi .kv{display:block;font-weight:600;letter-spacing:-.02em}
button.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:box-shadow .15s,border-color .15s}
button.kpi:hover{border-color:var(--line-2)}
.kpi.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.kon{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-weak);padding:0 7px;border-radius:9px;line-height:18px}
.prog{display:flex;align-items:center;gap:2px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
.ps{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font-size:12px;color:var(--fg-3);border:0;background:none;white-space:nowrap}
.ps.done{color:var(--fg-2)} .ps.done svg{color:var(--good)}
.ps.cur{background:var(--accent-weak);color:var(--accent);font-weight:600}
button.ps:hover{background:var(--hover);color:var(--fg)}
button.ps.cur:hover{background:var(--accent-weak);color:var(--accent-2)}
.vtabs{display:flex;align-items:center;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.vtabs button{position:relative;display:inline-flex;align-items:center;gap:7px;height:46px;padding:0 10px;border:0;background:none;font-size:13px;color:var(--fg-3);white-space:nowrap;font-weight:500}
.vtabs button:hover{color:var(--fg)}
.vtabs button b{font:500 11.5px var(--font-num);color:var(--fg-3);background:var(--sunken);padding:0 6px;border-radius:9px;line-height:18px}
.vtabs button[aria-selected="true"]{color:var(--fg)}
.vtabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}

function gen(P){
  const R=rng(P.seed*977+5), rr=(a,b)=>a+R()*(b-a), pick=a=>a[Math.floor(R()*a.length)];
  const miss=new Set(P.missing);

  const W=[['longtail',.40],['normal',.2],['nocvr',.1],['new',.08],['lost',.08],['scale',.06],['ctrup',.05],['worsen',.03]];
  const wpick=()=>{let x=R(),acc=0;for(const [k,w] of W){acc+=w;if(x<acc)return k}return 'normal'};
  P.heads.forEach((h,i)=>add(h,'head',i===2||i===5?'worsen':i===0||i===1?'core':pick(['core','core','scale','normal','worsen','scale'])));
  P.nouns.forEach(n=>{P.pre.forEach(m=>{if(R()<.85)add(`${m} ${n}`,'long',wpick())});P.post.forEach(m=>{if(R()<.85)add(`${n} ${m}`,'long',wpick())})});
  P.heads.slice(0,6).forEach(h=>{add('best '+h,'long',wpick());});
  P.typos.forEach(t=>add(t,'long',pick(['normal','longtail','scale'])));
  P.brand.forEach(b=>add(b,'brand','core'));
  P.comp.forEach(c=>add(c,'comp',pick(['nocvr','normal','nocvr','worsen'])));
  P.asins.forEach(a=>add(a,'asin',pick(['nocvr','normal','worsen','normal'])));
  const C={auto:{n:`SP-Auto-${P.code}-Main`,ag:()=>'AG-Auto-All',m:'auto'},
    broad:{n:'SP-Broad-Discovery',ag:t=>'AG-Broad-'+(P.broadRoots.find(b=>t.term.includes(b))||P.broadRoots[0]).replace(/^./,c=>c.toUpperCase()),m:'broad'},
    phrase:{n:'SP-Phrase-Longtail',ag:()=>'AG-Phrase-'+P.phraseRoot.replace(/^./,c=>c.toUpperCase()),m:'phrase'},
    exact:{n:'SP-Exact-Core',ag:t=>t.type==='head'?'AG-Exact-Top':'AG-Exact-Growth',m:'exact'},
    asin:{n:'SP-ASIN-Competitor',ag:()=>'AG-PAT-Rival-ASIN',m:'asin'},
    brand:{n:'SP-Brand-Defense',ag:()=>'AG-Brand-Exact',m:'exact'}};
  const rows=[]; let id=0;
  for(const T of terms){
    const pl=[];
    if(T.type==='asin'){pl.push(['asin',`asin="${T.term.toUpperCase()}"`]);if(R()<.6)pl.push(['auto','substitutes'])}
    else if(T.type==='brand'){pl.push(['brand',T.term]);pl.push(['auto','close-match'])}
    else{
      if(R()<.7)pl.push(['auto',pick(['close-match','close-match','loose-match','substitutes','complements'])]);
      if(R()<.5)pl.push(['broad',P.broadRoots.find(b=>T.term.includes(b))||P.broadRoots[0]]);
      if(T.term.includes(P.phraseRoot)&&R()<.45)pl.push(['phrase',P.phraseRoot]);
      if((T.type==='head'&&R()<.75)||(['core','worsen'].includes(T.arch)&&R()<.5)||(T.arch==='scale'&&R()<.25))pl.push(['exact',T.term]);
      if(!pl.length)pl.push(['auto','close-match']);
    }
    const made=[];
    for(const [kind,target] of pl){
      const c=C[kind];
      const base=({head:rr(260,1500),long:rr(4,55),comp:rr(60,360),asin:rr(25,150),brand:rr(50,160)})[T.type]*P.scale*({auto:.45,broad:.55,phrase:.5,exact:1,asin:1,brand:1})[kind]*(T.type==='long'?({lost:6,new:6,scale:12,nocvr:12,worsen:8,ctrup:6})[T.arch]||1:(T.arch==='nocvr'?3:1));
      const ctr=kind==='brand'?rr(.025,.045):kind==='exact'?rr(.005,.011):kind==='asin'?rr(.003,.006):rr(.0024,.0068);
      let cvr=({core:rr(.12,.17),scale:rr(.15,.21),worsen:rr(.11,.14),nocvr:rr(.002,.007),normal:rr(.06,.11),longtail:rr(.03,.15),new:rr(.08,.14),lost:rr(.07,.11),ctrup:rr(.07,.1)})[T.arch];
      if(T.type==='brand')cvr=rr(.18,.26);
      if(T.type==='comp')cvr*=.55;
      const cpc=(kind==='brand'?rr(.35,.6):rr(.6,1.5))*(kind==='exact'?1.12:1)*(T.arch==='scale'?.8:1);
      const k=({worsen:96+Math.floor(R()*4),new:101+Math.floor(R()*4),lost:96+Math.floor(R()*4),ctrup:98})[T.arch]||0;
      const row={id:id++,term:T.term,type:T.type,arch:T.arch,kind,camp:c.n,ag:c.ag(T),match:c.m,target,base,ctr,cvr,cpc,aov:P.aov,k};
      rows.push(row);made.push(row);
    }
    // 活动分化：合计不错，但某个非精准活动单独很差
    if(made.length>1&&['core','scale'].includes(T.arch)&&R()<.45){const r=made.find(x=>x.match!=='exact');if(r){r.cvr*=.28;r.cpc*=1.25}}
  }
  const wdF=[], trend=[];
  for(let t=0;t<N;t++){wdF[t]=[1.06,.94,.96,.98,1,1.04,1.1][dow(ds(t))];trend[t]=.82+.36*t/N}
  for(const row of rows){
    const F={impr:new Float64Array(N+1),clicks:new Float64Array(N+1),orders:new Float64Array(N+1),spend:new Float64Array(N+1),sales:new Float64Array(N+1)};
    let ci=0,cc=0,co=0,cs=0,csa=0;
    for(let t=0;t<N;t++){
      if(!miss.has(t)){
        const r=rng(row.id*7919+t*104729+P.seed*31);
        let act=1,iM=1,cM=1,vM=1,pM=1;
        if(row.arch==='worsen'&&t>=row.k){const f=Math.min(1,(t-row.k)/10);vM=1-.64*f;pM=1+.22*f}
        if(row.arch==='new'&&t<row.k)act=0;
        if(row.arch==='lost'&&t>row.k)act=0;
        if(row.arch==='ctrup'&&t>=row.k)cM=1.7;
        if(row.arch==='scale')iM=1+Math.max(0,t-60)/90;
        const ev=(t===88||t===89)?1.9:1, evV=(t===88||t===89)?1.25:1;
        const impr=act?Math.round(row.base*wdF[t]*trend[t]*ev*iM*(.7+.6*r())):0;
        const cx=impr*row.ctr*cM*(.75+.5*r()); let clicks=Math.floor(cx)+(r()<cx%1?1:0);
        const ox=clicks*row.cvr*vM*evV*(.5+r()); let orders=Math.floor(ox)+(r()<ox%1?1:0); if(orders>clicks)orders=clicks;
        const spend=Math.round(clicks*row.cpc*pM*(.85+.3*r())*100)/100;
        const sales=Math.round(orders*row.aov*(r()<.12?1.5:1)*100)/100;
        ci+=impr;cc+=clicks;co+=orders;cs+=spend;csa+=sales;
      }
      F.impr[t+1]=ci;F.clicks[t+1]=cc;F.orders[t+1]=co;F.spend[t+1]=cs;F.sales[t+1]=csa;
    }
    row.F=F;
  }
  return {rows,miss,camps:[...new Set(rows.map(r=>r.camp))],ags:[...new Set(rows.map(r=>r.ag))]};
}

// ---------- 标签与建议规则 ----------
const TAGKIND={'ACOS恶化':'risk','ACOS超目标':'risk','高点击无转化':'risk','消失':'risk','可放大':'opp','核心词':'opp','CTR提升':'chg','CVR提升':'chg','新增':'chg','活动分化':'warn','样本不足':'obs'};

const tagHTML=(t)=>`<span class="tag ${TAGKIND[t]}">${t}</span>`;
function thr(R){return{acos:R.newMode?R.acos*1.4:R.acos,minC:R.newMode?Math.round(R.minClicks*1.5):R.minClicks,noConv:R.newMode?R.noConv+10:R.noConv}}
function tagsOf(A,B,hasB,R){
  const T=thr(R), t=[];
  if(hasB){
    if(B.impr===0&&A.impr>0)t.push('新增');
    if(A.impr===0&&(B.orders>0||B.clicks>=5))t.push('消失');
    if(A.ctr!=null&&B.ctr!=null&&A.impr>=R.minImpr&&B.impr>=R.minImpr&&A.ctr>B.ctr*(1+R.chg))t.push('CTR提升');
    if(A.cvr!=null&&B.cvr!=null&&A.clicks>=T.minC&&B.clicks>=T.minC&&A.cvr>B.cvr*(1+R.chg))t.push('CVR提升');
  }
  const hiAcos=A.acos!=null&&A.acos>T.acos&&A.clicks>=T.minC;
  if(hiAcos&&hasB&&(B.acos==null?B.spend>0&&B.clicks>=T.minC:A.acos>B.acos*(1+R.chg)))t.push('ACOS恶化');
  else if(hiAcos)t.push('ACOS超目标');
  if(A.clicks>=T.noConv&&A.orders===0)t.push('高点击无转化');
  if(A.orders>=5&&A.acos!=null&&A.acos<=T.acos)t.push('核心词');
  if(A.orders>=3&&A.acos!=null&&A.acos<=T.acos*.7)t.push('可放大');
  if(!t.length&&A.impr>0&&A.clicks<T.minC)t.push('样本不足');

const pct=v=>v==null?'不可计算':(v*100).toFixed(1)+'%';
function suggestOf(kw,R,hasB,source){
  const T=thr(R), out=[];
  const brand=kw.kwtype==='品牌词';
  const hasExact=kw.rows.some(x=>x.r.match==='exact');
  for(const x of kw.rows){
    const a=x.a,b=x.b,r=x.r;
    const obj={camp:r.camp,ag:r.ag,target:r.target,match:r.match};
    const fact=`A 点击 ${fvt('clicks',a.clicks)} · 花费 ${fvt('spend',a.spend)} · 订单 ${a.orders} · ACOS ${fvt('acos',a.acos)}`;
    if(a.clicks>=T.noConv&&a.orders===0){
      out.push({action:brand?'人工复核品牌词':(r.match==='asin'?'否定 ASIN':'否定词'),obj,fact,pri:a.spend>25?'hi':'mid',kind:'risk',
        conds:[`A 点击 ${a.clicks} ≥ 无转化阈值 ${T.noConv}`,'A 订单 = 0',`A 花费 ${fvt('spend',a.spend)} 无回报`].concat(brand?['命中品牌保护词表，不建议直接否定']:[]),
        risk:brand?'品牌词受保护：先检查落地页与竞价，再决定':'否定后该活动不再为此词展示；若与产品高度相关，可先降价观察'});
    }else if(a.acos!=null&&a.acos>T.acos&&a.clicks>=T.minC&&(!hasB||b.acos==null||a.acos>b.acos*(1+R.chg))){
      out.push({action:brand?'人工复核品牌词':'降低竞价',obj,fact,pri:a.spend>40?'hi':'mid',kind:'risk',
        conds:[`A ACOS ${pct(a.acos)} > 目标 ${pct(T.acos)}`,hasB&&b.acos!=null?`较 B (${pct(b.acos)}) 上升 ${((a.acos/b.acos-1)*100).toFixed(0)}% > 变化阈值 ${(R.chg*100).toFixed(0)}%`:(hasB?'B 期无销售，ACOS 不可计算':'无 B 基准，仅按目标判断'),`A 点击 ${a.clicks} ≥ 最低样本 ${T.minC}`],
        risk:'降价会减少曝光；如该词在其他活动仍贡献订单，请只调整本活动'});
    }else if(a.orders>=3&&a.acos!=null&&a.acos<=T.acos*.7){
      const toExact=source==='term'&&r.match!=='exact'&&r.match!=='asin'&&!hasExact;
      out.push({action:toExact?'转 Exact':'提高竞价',obj,fact,pri:a.orders>=6?'mid':'lo',kind:'opp',
        conds:[`A 订单 ${a.orders} ≥ 3`,`A ACOS ${pct(a.acos)} ≤ 目标的 70%（${pct(T.acos*.7)}）`].concat(toExact?[`当前为 ${r.match} 匹配，尚无 Exact 投放`]:[]),
        risk:toExact?'新建 Exact 后原活动需加否定精准词，避免自我竞争':'提价后 CPC 上升，需观察 ACOS 是否仍在目标内'});
    }else if(hasB&&a.ctr!=null&&b.ctr!=null&&a.ctr>=b.ctr*.9&&a.cvr!=null&&b.cvr!=null&&b.cvr>0&&a.cvr<b.cvr*.6&&a.clicks>=20){
      out.push({action:'检查 Listing',obj,fact,pri:'mid',kind:'risk',conds:[`CTR 稳定（${fvt('ctr',a.ctr)} vs ${fvt('ctr',b.ctr)}）`,`CVR 从 ${pct(b.cvr)} 降到 ${pct(a.cvr)}`],risk:'转化下降可能来自价格、评论、库存或竞品，系统无法判断具体原因'});
    }
  }
  const rank={hi:0,mid:1,lo:2};out.sort((x,y)=>rank[x.pri]-rank[y.pri]);
  return out;
}

let memo={k:null,v:null};
function calc(sc){
  const P=proj(); if(!P||P.empty)return null;
  const D=pdata(P);
  const key=JSON.stringify([P.id,sc,S.rules]);
  if(memo.k===key)return memo.v;
  const A=[di(sc.A.s),di(sc.A.e)],B=[di(sc.B.s),di(sc.B.e)],f=sc.f;
  const covA=coverage(D,A[0],A[1]),covB=coverage(D,B[0],B[1]);
  const hasB=covB.n>0;
  const rows=D.rows.filter(r=>(!f.campaigns.length||f.campaigns.includes(r.camp))&&(!f.adgroups.length||f.adgroups.includes(r.ag))&&(!f.match.length||f.match.includes(r.match))&&(!f.target||r.target.toLowerCase().includes(f.target.toLowerCase()))&&(!f.term||r.term===f.term.trim().toLowerCase()));
  const map=new Map(); const tA=Z(),tB=Z(); let nRows=0;
  for(const r of rows){
    const a=sumRow(r,A[0],A[1]),b=sumRow(r,B[0],B[1]);
    if(a.impr===0&&b.impr===0)continue;
    addTo(tA,a);addTo(tB,b);nRows++;
    const key=sc.source==='term'?r.term:r.target;
    let k=map.get(key);
    if(!k){k={key,rows:[],kwtype:kwType(r,sc.source)};map.set(key,k)}
    k.rows.push({r,a:derive(a),b:derive(b)});
  }
  const kws=[];
  for(const k of map.values()){
    const a=Z(),b=Z();k.rows.forEach(x=>{addTo(a,x.a);addTo(b,x.b)});
    k.A=derive(a);k.B=derive(b);
    k.rows.sort((x,y)=>y.a.spend-x.a.spend);
    k.tags=tagsOf(k.A,k.B,hasB,S.rules);
    k.rows.forEach(x=>{x.tags=tagsOf(x.a,x.b,hasB,S.rules)});
    const good=k.tags.some(t=>t==='核心词'||t==='可放大'), bad=k.tags.some(t=>TAGKIND[t]==='risk');
    if(k.rows.length>1&&((good&&k.rows.some(x=>x.tags.some(t=>TAGKIND[t]==='risk')))||(bad&&k.rows.some(x=>x.tags.includes('可放大')||x.tags.includes('核心词')))))k.tags.push('活动分化');
    k.tags.sort((x,y)=>TAGORDER.indexOf(x)-TAGORDER.indexOf(y));
    k.sugg=suggestOf(k,S.rules,hasB,sc.source);
    k.matches=[...new Set(k.rows.map(x=>x.r.match))];
    k.camps=[...new Set(k.rows.map(x=>x.r.camp))];
    k.ags=[...new Set(k.rows.map(x=>x.r.ag))];

  const tagCount={};kws.forEach(k=>k.tags.forEach(t=>tagCount[t]=(tagCount[t]||0)+1));

  memo={k:key,v};return v;
}
function kwType(r,source){

  if(r.type==='brand')return '品牌词';
  if(r.type==='comp')return '竞品词';
  const t=source==='term'?r.term:r.target;
  return t.split(' ').length>=4?'长尾词':'通用词';
}

// ---------- 变化拆解 ----------
// 对数均值分解（LMDI）：总变化 = Σ 各因素贡献，且无残差。量指标在 A/B 覆盖天数不同时按日均计算。
function decompAB(A,B,nA,nB,m){
  const per=nA!==nB,fA=per?1/nA:1,fB=per?1/nB:1,aov=x=>x.orders?x.sales/x.orders:null;
  let tA,tB,fac,unit='money';
  if(m==='sales'){tA=A.sales*fA;tB=B.sales*fB;fac=[['曝光',A.impr*fA,B.impr*fB,1],['CTR',A.ctr,B.ctr,1],['CVR',A.cvr,B.cvr,1],['客单价',aov(A),aov(B),1]]}
  else if(m==='spend'){tA=A.spend*fA;tB=B.spend*fB;fac=[['曝光',A.impr*fA,B.impr*fB,1],['CTR',A.ctr,B.ctr,1],['CPC',A.cpc,B.cpc,1]]}
  else{tA=A.acos;tB=B.acos;unit='pt';fac=[['CPC',A.cpc,B.cpc,1],['CVR',A.cvr,B.cvr,-1],['客单价',aov(A),aov(B),-1]]}
  if(!(tA>0&&tB>0)||fac.some(f=>!(f[1]>0&&f[2]>0)))return null;
  const L=Math.abs(tA-tB)<1e-12?tA:(tA-tB)/Math.log(tA/tB);
  return {m,tA,tB,per,unit,steps:fac.map(([l,a,b,sg])=>({l,a,b,chg:a/b-1,v:L*Math.log(a/b)*sg}))};
}
const decomp=(R,m)=>R.hasB?decompAB(R.A,R.B,R.covA.n,R.covB.n,m):null;
function fmtD(d,v,sign){
  if(d.unit==='pt')return sign?((v>0?'+':v<0?'−':'')+Math.abs(v*100).toFixed(1)+'pt'):(v*100).toFixed(1)+'%';
  const a=Math.abs(v),t=cur()+(a<10&&sign?a.toFixed(1):nf0.format(Math.round(a)));
  return sign?(v>0?'+':v<0?'−':'')+t:t;
}
const facV=(l,v)=>l==='CPC'||l==='客单价'?cur()+v.toFixed(2):l==='曝光'?nf0.format(Math.round(v)):(v*100).toFixed(2)+'%';
const pcs=v=>Math.abs(v)<.005?'持平':(v>0?'+':'−')+Math.abs(v*100).toFixed(1)+'%';
function fxChips(d,small){
  const main=[...d.steps].sort((a,b)=>Math.abs(b.v)-Math.abs(a.v))[0];
  const sem={sales:1,spend:0,acos:-1}[d.m];
  return d.steps.map(s=>{const cls=Math.abs(s.chg)<.005?'flat':sem===0?'flat':((s.v>0)===(sem>0)?'up':'down');return `<div class="fx ${cls}${!small&&s===main&&Math.abs(s.v)>0?' main':''}" title="${s.l}：A ${facV(s.l,s.a)} · B ${facV(s.l,s.b)}${d.per&&s.l==='曝光'?'（日均）':''}"><span class="fl">${s.l}</span><b>${pcs(s.chg)}</b><small>贡献 ${fmtD(d,s.v,true)}${d.per&&d.unit==='money'?'/天':''}</small></div>`}).join(small?'':'<span class="fx-op">×</span>');
}
function insight(R){
  if(!R.hasB)return `<section class="panel insight"><div class="ins-h"><span class="ins-tag">${ic('sparkles')}本期结论</span></div><p class="ins-s">B 期没有可用数据，暂不生成对比结论。调整 B 期后会自动给出。</p></section>`;
  const dS=decomp(R,'sales'),dP=decomp(R,'spend'),dA=decomp(R,'acos');
  if(!dS)return '';
  const sChg=dS.tA/dS.tB-1,pChg=dP?dP.tA/dP.tB-1:null;
  const main=[...dS.steps].sort((a,b)=>Math.abs(b.v)-Math.abs(a.v))[0];
  const verb=v=>Math.abs(v)<.005?'持平':v>0?'上升':'下降';
  const dayW=dS.per?'日均':'';
  const head=Math.abs(sChg)<.005?`广告销售额${dayW}与 B 期基本持平`:`广告销售额${dayW}<em class="${sChg>0?'up':''}">${sChg>0?'增长':'下降'} ${Math.abs(sChg*100).toFixed(1)}%</em>，主要来自${main.l}${verb(main.chg)}`;
  const sub=`${dayW?'日均':''}销售额 <b>${fmtD(dS,dS.tA)}</b>（B ${fmtD(dS,dS.tB)}）；花费${dayW}${verb(pChg)}${pChg!=null&&Math.abs(pChg)>=.005?` <b>${pcs(pChg)}</b>`:''}${dA?`，ACOS 从 <b>${pct(dA.tB)}</b> 变为 <b>${pct(dA.tA)}</b>`:''}。下方为销售额 = 曝光 × CTR × CVR × 客单价 的拆解。`;
  const dk=R.kws.map(k=>({k,d:k.A.sales-k.B.sales})).filter(x=>x.d!==0).sort((a,b)=>a.d-b.d);
  const pick=sChg<0?dk.slice(0,3):dk.slice(-3).reverse();
  return `<section class="panel insight" aria-label="本期结论">
    <div class="ins-h"><span class="ins-tag">${ic('sparkles')}本期结论</span><span class="muted">规则生成 · 非 AI · 由汇总基础量计算</span><span class="newb">新增</span></div>
    <h2 class="ins-t">${head}</h2>
    <p class="ins-s">${sub}</p>
    <div class="fxrow" aria-label="销售额拆解">${fxChips(dS)}</div>
    <div class="ins-k"><span class="muted">${sChg<0?'拖累最大的词':'贡献最大的词'}（销售额合计变化）</span>${pick.map(x=>`<button class="kwchip" data-act="openKw" data-key="${esc(x.k.key)}" title="${esc(x.k.key)}"><span>${esc(x.k.key)}</span><b class="${x.d<0?'neg':'pos'}">${x.d<0?'−':'+'}${money0(Math.abs(x.d))}</b></button>`).join('')}<button class="btn sm ghost" data-act="nav" data-v="diagnosis">查看完整拆解${ic('arrow-right')}</button></div>
  </section>`;
}
function wkSpark(k){
  const end=di(S.shown.A.e),v=[];
  for(let w=7;w>=0;w--){const e=end-w*7,s0=e-6;let t=0;k.rows.forEach(x=>{t+=sumRow(x.r,s0,e).spend});v.push(t)}

      <div class="panel-b">${R.hasB?`<div class="muted tn" style="font-size:12px;margin-bottom:6px">合计变化 ${totD>=0?'+':''}${m==='orders'?nf0.format(totD):money0(totD)} · 贡献最大的 12 个词（点击查看详情）</div>

function md2html(m){
  const lines=m.split('\n');let h='',inL=false,inT=false;
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
  const close=()=>{if(inL){h+='</ul>';inL=false}if(inT){h+='</tbody></table>';inT=false}};
  for(const l of lines){
    if(/^\|/.test(l)){if(/^\|[\s-|]+\|$/.test(l))continue;const cells=l.split('|').slice(1,-1).map(c=>c.trim());if(!inT){close();h+='<table><thead><tr>'+cells.map(c=>`<th>${inl(c)}</th>`).join('')+'</tr></thead><tbody>';inT=true}else h+='<tr>'+cells.map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>';continue}
    if(/^- /.test(l)){if(!inL){close();h+='<ul>';inL=true}h+=`<li>${inl(l.slice(2))}</li>`;continue}
    close();
    if(/^# /.test(l))h+=`<h1>${inl(l.slice(2))}</h1>`;else if(/^## /.test(l))h+=`<h2>${inl(l.slice(3))}</h2>`;else if(/^> /.test(l))h+=`<blockquote>${inl(l.slice(2))}</blockquote>`;else if(l.trim())h+=`<p>${inl(l)}</p>`;
  }
  close();return h;
}

// ---------- 周期优化 ----------

const CYC_STEPS=[['prep','准备与回看'],['diag','诊断'],['harvest','收割'],['neg','否定'],['bid','调价'],['export','确认导出']];
const BIDK=[['down','亏损降价'],['down0','无单降价'],['pause','暂停'],['up','盈利提价'],['keep','维持'],['watch','观察']];

}
let cycMemo={k:null,v:null};
function cycleData(R){
  const key=JSON.stringify([S.projectId,S.shown,S.rules]);

  const T=thr(S.rules),Ru=S.rules,wk=7/Math.max(1,R.covA.n),harvest=[],neg=[],bids=[];
  if(S.shown.source==='term'){
    for(const k of R.kws){
      if(k.kwtype==='品牌词')continue;
      const hasExact=k.rows.some(x=>x.r.match==='exact'||x.r.match==='asin');
      const from=k.rows.filter(x=>x.r.match==='auto'||x.r.match==='broad'||x.r.match==='phrase');
      if(!hasExact&&from.length){
        const z=Z();from.forEach(x=>addTo(z,x.a));const a=derive(z);
        if(a.orders>=Ru.harvestMin&&a.acos!=null&&a.acos<=T.acos){
          const rpc=a.sales/a.clicks,bid=r2(Math.min(a.cpc*1.6,Math.max(a.cpc*.9,rpc*T.acos))),asin=k.kwtype==='ASIN';
          harvest.push({id:'h|'+k.key,type:'harvest',key:k.key,asin,a,rpc,bid,from:from.map(x=>x.r),conf:a.orders>=3?'high':'mid',to:asin?{camp:'SP-ASIN-Competitor',ag:'AG-PAT-Rival-ASIN'}:{camp:'SP-Exact-Core',ag:'AG-Exact-Growth'}});
        }

      for(const x of k.rows){
        if(x.r.match==='exact'||x.r.match==='asin')continue;
        const a=x.a;
        if(a.orders===0&&a.clicks>=T.minC&&(a.clicks>=T.noConv||a.spend>=Ru.cpa*1.5)){
          const brand=isBrandT(k.key);

    if(a.orders===0&&a.clicks<T.minC){kind='watch';why=`点击 ${a.clicks} 次，未到最低样本 ${T.minC}`}

  neg.sort((x,y)=>y.a.spend-x.a.spend);

function cycImpact(cd){

    negSave:n.reduce((t,x)=>t+x.waste,0),bidSave:b.reduce((t,x)=>t+x.save,0),upCost:b.reduce((t,x)=>t+x.extra,0),total:h.length+n.length+b.length};

function prevCycle(R){

      out.push({act:'降价',d:`${Math.round(Math.max(-S.rules.maxDown,T.acos/b.acos-1)*100)}%`,obj:g.target,ctx,m:'acos',bv:b.acos,av:a.acos,res,w:b.spend});

    }

    if(r.match==='exact'||r.match==='asin')continue;
    const b=derive(sumRow(r,R.Bi[0],R.Bi[1])),a=derive(sumRow(r,R.Ai[0],R.Ai[1]));

function bulkRows(cd){

    const seen=new Set();h.from.forEach(r=>{const k=r.camp+'|'+r.ag;if(seen.has(k))return;seen.add(k);rows.push([h.asin?'Negative Product Targeting':'Negative Keyword','Create',r.camp,r.ag,h.asin?asinX(h.key):h.key,h.asin?'—':'Negative Exact','','enabled'])});

function wfScale(d){
  let run=d.tB;const lv=[d.tB,d.tA];d.steps.forEach(x=>{lv.push(run);run+=x.v;lv.push(run)});

function wfChart(el,R){
