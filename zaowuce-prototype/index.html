<title>造物册工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* 布局：安静的工作资料册。桌面为轻侧栏＋内容区，手机为顶栏＋抽屉菜单；首页以任务为入口，详情页按「准备→运行→核对→下次」组织。 */
:root {
  --paper: #f3f5f4;
  --surface: #ffffff;
  --sunken: #e9edec;
  --ink: #1b2330;
  --ink-2: #485263;
  --ink-3: #737d8c;
  --rule: #d7dde0;
  --accent: #2c4f9e;
  --accent-ink: #ffffff;
  --accent-soft: #e5ebf7;
  --ok: #2c7a4d;
  --ok-soft: #e2f1e8;
  --warn: #9a620f;
  --warn-soft: #f8eedb;
  --bad: #b03636;
  --bad-soft: #f7e3e3;
  --focus: #2c4f9e;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  --r: 10px;
  --side: 236px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13171c; --surface: #1a1f26; --sunken: #20262e; --ink: #e5e8ec; --ink-2: #b1b8c3; --ink-3: #848c99;
    --rule: #2c333c; --accent: #8ea8ea; --accent-ink: #10162a; --accent-soft: #222d47;
    --ok: #6cc590; --ok-soft: #1b3326; --warn: #e2a94c; --warn-soft: #382a14; --bad: #e77d7d; --bad-soft: #3a1d1d; --focus: #8ea8ea;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13171c; --surface: #1a1f26; --sunken: #20262e; --ink: #e5e8ec; --ink-2: #b1b8c3; --ink-3: #848c99;
  --rule: #2c333c; --accent: #8ea8ea; --accent-ink: #10162a; --accent-soft: #222d47;
  --ok: #6cc590; --ok-soft: #1b3326; --warn: #e2a94c; --warn-soft: #382a14; --bad: #e77d7d; --bad-soft: #3a1d1d; --focus: #8ea8ea;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.3; font-weight: 700; letter-spacing: .01em; }
h2 { font-family: var(--f-display); font-size: 1.3rem; line-height: 1.4; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 700; line-height: 1.5; }
p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--f-mono); font-size: .86em; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: .86rem; }
.eyebrow { font-size: .76rem; letter-spacing: .12em; color: var(--ink-3); font-weight: 500; }

/* 框架 */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); gap: 32px; max-width: 1240px; margin: 0 auto; min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; display: flex; flex-direction: column; gap: 20px; padding-block: 28px 20px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding-inline: 10px; }
.brand b { font-family: var(--f-display); font-size: 1.55rem; letter-spacing: .08em; color: var(--ink); }
.brand span { font-family: var(--f-mono); font-size: .76rem; color: var(--ink-3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); font-weight: 500; }
.nav a:hover { background: var(--sunken); text-decoration: none; }
.nav a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.nav .sep { height: 1px; background: var(--rule); margin: 10px 10px; }
.nav .count { font-family: var(--f-mono); font-size: .76rem; color: var(--ink-3); }
.who { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 12px 10px 0; border-top: 1px solid var(--rule); }
.who b { font-weight: 500; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-align: left; }

.main { min-width: 0; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 28px; }
.topbar { display: flex; gap: 12px; align-items: center; }
.topbar .menu-btn { display: none; }
.search { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 6px 4px 16px; max-width: 560px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: var(--ink); padding: 6px 0; }
.search input:focus { outline: none; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.topbar .feedback { margin-left: auto; white-space: nowrap; }
.proto-note { font-size: .8rem; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 6px 12px; }

/* 通用部件 */
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 500; cursor: pointer; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); text-decoration: none; }
.btn:hover { text-decoration: none; border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 5px 12px; font-size: .86rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.plain::before { display: none; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 20px 22px; }
.notice { display: flex; gap: 12px; border-radius: var(--r); padding: 14px 16px; background: var(--accent-soft); color: var(--ink); }
.notice.warn { background: var(--warn-soft); }
.notice.bad { background: var(--bad-soft); }
.notice .k { font-weight: 700; white-space: nowrap; }
.notice.warn .k { color: var(--warn); }
.notice.bad .k { color: var(--bad); }
.notice .k.info { color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.lg { gap: 20px; }
.crumb { font-size: .86rem; color: var(--ink-3); }
.crumb a { color: var(--ink-3); }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 500; color: var(--ink-3); font-size: .8rem; letter-spacing: .04em; background: var(--sunken); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* 首页 */
.hero { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.hero p { color: var(--ink-2); max-width: 46em; }
.tasks { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 14px; }
.task { display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
.task:hover { border-color: var(--accent); text-decoration: none; }
.task .go { margin-top: auto; color: var(--accent); font-weight: 500; font-size: .92rem; }
.task.lead { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.task.lead .eyebrow, .task.lead p, .task.lead .go { color: var(--accent-ink); opacity: .92; }
.task h3 { font-family: var(--f-display); font-size: 1.2rem; font-weight: 600; }
.task p { font-size: .9rem; color: var(--ink-2); }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.trio > div { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; border-left: 1px solid var(--rule); }
.trio > div:first-child { border-left: 0; }
.trio .rec { background: var(--accent-soft); }
.two { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; }
.list { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.list > * { display: flex; gap: 12px; justify-content: space-between; align-items: baseline; padding: 11px 2px; border-bottom: 1px solid var(--rule); color: var(--ink); }
.list > a:hover { text-decoration: none; background: var(--sunken); }
.list .date { font-family: var(--f-mono); font-size: .8rem; color: var(--ink-3); white-space: nowrap; }

/* 目录 */
.filters { display: flex; gap: 18px; flex-wrap: wrap; }
.fgroup { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fgroup > span { font-size: .8rem; color: var(--ink-3); margin-right: 4px; }
.chip { font: inherit; font-size: .85rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.catalog { display: flex; flex-direction: column; gap: 10px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 20px; padding: 16px 20px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); color: var(--ink); }
.item:hover { border-color: var(--accent); text-decoration: none; }
.item .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.item .side-info { grid-row: span 2; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; font-size: .82rem; color: var(--ink-3); }
.item h3 { font-size: 1.05rem; }
.item p { color: var(--ink-2); font-size: .92rem; }
.empty { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; color: var(--ink-2); border: 1px dashed var(--rule); border-radius: var(--r); }
.empty b { color: var(--ink); font-size: 1.05rem; }

/* 详情 */
.detail-head { display: flex; flex-direction: column; gap: 12px; }
.detail-head .aliases { color: var(--ink-3); font-size: .9rem; }
.detail { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 28px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); display: flex; flex-direction: column; gap: 2px; border-left: 2px solid var(--rule); }
.rail button { all: unset; cursor: pointer; padding: 6px 12px; margin-left: -2px; border-left: 2px solid transparent; color: var(--ink-2); font-size: .92rem; display: flex; gap: 8px; }
.rail button .n { font-family: var(--f-mono); color: var(--ink-3); font-size: .8rem; padding-top: 2px; }
.rail button:hover { color: var(--ink); }
.rail button.on { border-left-color: var(--accent); color: var(--ink); font-weight: 500; }
.rail button:focus-visible { outline: 2px solid var(--focus); }
.steps { display: flex; flex-direction: column; gap: 36px; min-width: 0; }
.step { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 24px; }
.step-title { display: flex; gap: 12px; align-items: baseline; }
.step-title .n { font-family: var(--f-mono); font-size: .82rem; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 8px; }
ol.plain { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.checks { display: flex; flex-direction: column; gap: 2px; }
.checks label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 4px; border-bottom: 1px solid var(--rule); cursor: pointer; }
.checks label:last-child { border-bottom: 0; }
.checks input { margin-top: 5px; accent-color: var(--accent); }
.status3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.status3 > div { padding: 14px; border-radius: var(--r); display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--rule); }
.carry { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; }
.carry .f { padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--rule); display: flex; flex-direction: column; gap: 2px; }
.carry .arrow { color: var(--ink-3); font-family: var(--f-mono); }
.related { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.related a { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--rule); color: var(--ink); }
.related a:hover { border-color: var(--accent); text-decoration: none; }
.prose { max-width: 42em; display: flex; flex-direction: column; gap: 14px; color: var(--ink); }
.prose h2 { margin-top: 10px; }
pre.prompt { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--f-mono); font-size: .84rem; line-height: 1.7; background: var(--sunken); border-radius: var(--r); padding: 16px 18px; max-height: 320px; overflow: auto; }
textarea { width: 100%; min-height: 160px; font: inherit; font-family: var(--f-mono); font-size: .88rem; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px; resize: vertical; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }

/* 表单与管理 */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: .86rem; color: var(--ink-2); font-weight: 500; }
.field input, .field select { font: inherit; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding-block: 40px; }
.login { width: min(400px, 100%); display: flex; flex-direction: column; gap: 18px; }
.login .brand { padding: 0; }
.states { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.states .panel { display: flex; flex-direction: column; gap: 10px; }
.code-big { font-family: var(--f-mono); font-size: 2rem; color: var(--ink-3); line-height: 1; }

mark { background: var(--warn-soft); color: var(--ink); border-radius: 3px; padding: 0 2px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: .9rem; z-index: 30; max-width: calc(100% - 32px); }
.scrim { display: none; }

@media (max-width: 1020px) {
  .tasks { grid-template-columns: 1fr 1fr; }
  .tasks .lead { grid-column: 1 / -1; }
  .two { grid-template-columns: 1fr; }
  .related { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .side { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: min(280px, 84vw); height: auto; background: var(--paper); border-right: 1px solid var(--rule); padding: calc(20px + env(safe-area-inset-top, 0px)) 14px calc(20px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); transform: translateX(-102%); transition: transform .2s ease; }
  .side.open { transform: none; }
  .scrim.open { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.35); }
  .topbar .menu-btn { display: inline-flex; }
  .topbar .feedback { display: none; }
  .detail { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; flex-direction: row; overflow-x: auto; border-left: 0; border-bottom: 2px solid var(--rule); }
  .rail button { margin: 0 0 -2px; border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
  .rail button.on { border-bottom-color: var(--accent); }
}
@media (max-width: 620px) {
  h1 { font-size: 1.55rem; }
  .tasks, .related, .status3, .states, .split { grid-template-columns: 1fr; }
  .trio { grid-template-columns: 1fr; }
  .trio > div { border-left: 0; border-top: 1px solid var(--rule); }
  .trio > div:first-child { border-top: 0; }
  .item { grid-template-columns: 1fr; }
  .item .side-info { grid-row: auto; align-items: flex-start; text-align: left; flex-direction: row; flex-wrap: wrap; }
  .carry { grid-template-columns: 1fr; }
  .carry .arrow { transform: rotate(90deg); justify-self: center; }
  .panel { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div id="root"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const skills = [

      <div class="row">${pill(s.maturity)}<span class="pill plain">${s.topic}</span><span class="pill plain mono">${s.ver}</span></div>
      <h1>${s.name}</h1>
      <p>${s.summary}</p>
      ${s.maturity === 'sample' ? '<div class="notice warn"><span class="k">示例</span><span>这份 SKILL 还没有用真实任务验证过，输出需要你自己仔细检查。</span></div>' : ''}
      <div class="row">
        <button class="btn primary" data-act="copy-prompt">复制提示词</button>
        <button class="btn" data-act="download">下载 SKILL 文件</button>
      </div>
    </section>
    <div class="two">
      <section class="stack">
        <h2>使用前确认</h2>
        <div class="table-wrap"><table><tbody>
          <tr><th>适用环境</th><td>${s.env}</td></tr>
          <tr><th>适合</th><td>已有整理好的输入数据，需要一份结构化结果</td></tr>
          <tr><th>不适合</th><td>需要实时数据或登录第三方后台的任务</td></tr>
          <tr><th>数据提醒</th><td>你粘贴进 AI 工具的内容会交给该工具处理，请先脱敏</td></tr>
        </tbody></table></div>
        <h2>检查输出</h2>
        <div class="panel"><div class="checks">
          <label><input type="checkbox" id="k1"> 输出结构与下方提示词要求一致</label>
          <label><input type="checkbox" id="k2"> 每个结论都能在输入中找到依据</label>
          <label><input type="checkbox" id="k3"> 没有出现输入里不存在的数字</label>
        </div></div>
      </section>
      <section class="stack">
        <h2>提示词</h2>
        <pre class="prompt" id="prompt-text">你是一名${s.topic}助手。
任务：${s.summary}

输入：
1. 我会粘贴本次的数据（已脱敏）。
2. 如有缺失字段，请先列出，不要猜测。

输出：
- 一张表格，列出每项检查的结果
- 单独列出「需要人工核对」的条目
- 不确定的地方明确写「待确认」</pre>
        <p class="small muted">变更记录：${s.ver} 为当前版本（布局示例）。</p>
      </section>
    </div>`);
  skills.forEach(s => { pages['skill-' + s.id] = skillPage(s); });

  pages.knowledge = () => {
    const kinds = ['入门', '教程', '常见问题'];
    const list = docs.filter(d => state.kind === 'all' || d.kind === state.kind);
    return shell('knowledge', `
      <section class="stack">
        <span class="eyebrow">知识库</span>
        <h1>教程与常见问题</h1>
      </section>
      <div class="fgroup">${[['all', '全部'], ...kinds.map(k => [k, k])].map(([v, l]) => `<button class="chip" data-filter="kind" data-v="${v}" aria-pressed="${state.kind === v}">${l}</button>`).join('')}</div>
      <div class="catalog">
        ${list.map(d => `
        <a class="item" href="#doc-${d.id}">
          <div class="meta"><h3>${d.name}</h3><span class="pill plain">${d.kind}</span></div>
          <div class="side-info"><span>适用版本</span><span class="mono">${d.applies}</span></div>
          <p>${d.summary}</p>
        </a>`).join('')}
      </div>`);
  };

  const docPage = d => () => shell('knowledge', `
    <div class="crumb"><a href="#knowledge">知识库</a> / ${d.name}</div>
    <article class="prose">
      <div class="row"><span class="pill plain">${d.kind}</span><span class="pill plain">适用 <span class="mono">${d.applies}</span></span></div>
      <h1>${d.name}</h1>
      <p>${d.summary}</p>
      ${d.applies !== '—' ? '<div class="notice warn"><span class="k">版本提示</span><span>本文按下载包 v1.0.10 编写。推荐版本确定后，如有变化会在这里提示。</span></div>' : ''}
      ${d.id === 'which-tool' ? `
        <div class="table-wrap"><table>
          <thead><tr><th>程序</th><th>做什么</th><th>现在能否使用</th></tr></thead>
          <tbody>
            <tr><td><a href="#tool-inventory"><b>进销存表格更新</b></a></td><td>生成新版进销存表格</td><td>可以，推荐</td></tr>
            <tr><td><a href="#tool-visualizer">进销存可视化程序</a></td><td>团队在线查看库存与计划</td><td>尚未开放</td></tr>
            <tr><td><a href="#tool-script">脚本更新</a></td><td>原有 WPS 脚本流程</td><td>仅作对照，新同事不要使用</td></tr>
          </tbody>
        </table></div>` : `
        <h2>开始前</h2>
        <p>准备好练习样表 SAMPLE-01，或按《准备三类文件》准备正式文件。确认你的电脑系统在下载页的已验证列表中。</p>
        <h2>步骤</h2>
        <ol class="plain"><li>下载并启动程序。</li><li>选择三类文件并预检。</li><li>生成后分别下载主结果和更新记录。</li><li>按核对清单检查结果。</li></ol>
        <h2>常见问题</h2>
        <p>预检提示问题时，正式结果不会被修改，补齐后重新预检即可。</p>`}
      <div class="row"><a class="btn" href="#tool-${d.tool}">前往工具</a><a class="small" href="#states" data-act="feedback">这篇有问题？反馈</a></div>
    </article>`);
  docs.forEach(d => { pages['doc-' + d.id] = docPage(d); });

  pages.search = () => {
    const q = state.q.trim();
    const lower = q.toLowerCase();
    const hit = (...fields) => lower && fields.join(' ').toLowerCase().includes(lower);
    const mark = s => {
      const e = esc(s);
      if (!q) return e;
      const qe = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return e.replace(new RegExp(qe, 'gi'), m => `<mark>${m}</mark>`);
    };
    const r = [
      ...tools.filter(t => hit(t.name, t.aliases.join(' '), t.summary)).map(t => ({ k: '工具', to: 'tool-' + t.id, n: t.name, s: t.summary, a: t.aliases.find(a => a.toLowerCase().includes(lower)) })),
      ...skills.filter(s => hit(s.name, s.topic, s.summary)).map(s => ({ k: 'SKILL', to: 'skill-' + s.id, n: s.name, s: s.summary })),
      ...docs.filter(d => hit(d.name, d.summary, d.kind)).map(d => ({ k: d.kind, to: 'doc-' + d.id, n: d.name, s: d.summary }))
    ];
    return shell('', `
      <section class="stack">
        <span class="eyebrow">搜索</span>
        <h1>${q ? `「${esc(q)}」的结果` : '搜索'}</h1>
        ${q ? `<p class="muted">共 ${r.length} 条，只包含你有权查看的内容。</p>` : '<p class="muted">输入工具名、旧称或用途，例如「报表更新器」。</p>'}
      </section>
      <div class="catalog">
        ${r.length ? r.map(x => `
          <a class="item" href="#${x.to}">
            <div class="meta"><h3>${mark(x.n)}</h3><span class="pill plain">${x.k}</span></div>
            <div class="side-info">${x.a ? `<span>旧称：${mark(x.a)}</span>` : ''}</div>
            <p>${mark(x.s)}</p>
          </a>`).join('') : q ? `
          <div class="empty"><b>没有找到相关内容</b><span>试试更短的词，或用旧称搜索。</span><div class="row"><a class="btn small" href="#tools">查看全部工具</a><a class="btn small" href="#states" data-act="feedback">告诉我们缺什么</a></div></div>` : ''}
      </div>`);
  };

  pages.admin = () => shell('admin', `
    <section class="stack">
      <span class="eyebrow">仅所有者可见</span>
      <h1>成员管理</h1>
      <p class="muted">账号由你手工开通，把账号和初始密码私下发给同事。内容的编辑和发布在你电脑上的内容文件里完成，不在这里。</p>
    </section>
    <form class="panel row" id="add-form" style="align-items:flex-end">
      <div class="field" style="flex:1;min-width:160px"><label for="m-name">姓名</label><input id="m-name" required placeholder="例如：运营同事"></div>
      <div class="field" style="flex:1;min-width:160px"><label for="m-acc">登录账号</label><input id="m-acc" required placeholder="字母或数字"></div>
      <button class="btn primary" type="submit">开通账号</button>
    </form>
    <div class="table-wrap"><table>
      <thead><tr><th>姓名</th><th>账号</th><th>角色</th><th>状态</th><th>操作</th></tr></thead>
      <tbody>${members.map((m, i) => `
        <tr><td>${esc(m.name)}</td><td class="mono">${esc(m.account)}</td><td>${m.role}</td>
        <td>${m.on ? '<span class="pill ok">可登录</span>' : '<span class="pill">已停用</span>'}</td>
        <td>${m.role === '所有者' ? '<span class="muted small">—</span>' : `<div class="row"><button class="btn small" data-act="toggle" data-i="${i}">${m.on ? '停用' : '恢复'}</button><button class="btn small" data-act="reset" data-i="${i}">重置密码</button></div>`}</td></tr>`).join('')}
      </tbody>
    </table></div>
    <div class="notice"><span class="k info">停用后</span><span>该同事立即无法登录和下载，已打开的页面在下一次操作时退出。已经下载到其电脑上的程序仍能运行，已复制的资料无法收回。</span></div>`);

  pages.states = () => shell('states', `
    <section class="stack">
      <span class="eyebrow">评审用</span>
      <h1>页面状态样例</h1>
      <p class="muted">正式上线时这些状态出现在对应页面中，这里集中展示，方便检查文案。</p>
    </section>
    <div class="states">
      <div class="panel"><span class="code-big">403</span><h3>没有权限查看此页面</h3><p class="small muted">这一页仅所有者可见。如果你需要它，请联系站主。</p><div class="row"><a class="btn small" href="#home">回到工作台</a></div></div>
      <div class="panel"><span class="pill bad">已撤回</span><h3>这个下载包已停止提供</h3><p class="small muted">v1.0.10 · Mac · 注释版 发现问题后撤回，请改用替代版本。</p><div class="row"><button class="btn small" data-act="download">下载替代版本</button></div></div>
      <div class="panel"><span class="pill warn">校验未通过</span><h3>文件完整性校验失败</h3><p class="small muted">服务器上的文件与发布清单不一致，暂停下载。站主已收到提醒，修复后会恢复。</p></div>
      <div class="panel"><span class="pill">已停用</span><h3>你的账号已停用</h3><p class="small muted">无法登录造物册。如有疑问，请联系站主。</p></div>
      <div class="panel"><span class="pill info">尚未开放</span><h3>这个工具还不能在线使用</h3><p class="small muted">开放后会在这里显示「打开工具」。现在可以先阅读说明。</p></div>
      <div class="panel"><span class="code-big">!</span><h3>页面加载失败</h3><p class="small muted">网络中断或服务器正在维护。刷新页面重试；仍然失败，请在群里告诉站主。</p><div class="row"><button class="btn small" data-act="reload">重试</button></div></div>
    </div>
    <section class="stack">
      <h2>问题反馈</h2>
      <p class="muted">反馈途径为团队群或站主邮箱，地址会显示在这里供复制。网站本身不收集反馈表单。</p>
      <div class="row"><span class="mono panel" style="padding:8px 14px">（反馈地址待定）</span></div>
    </section>`);

  pages.login = () => `
    <div class="login-wrap">
      <form class="login panel" id="login-form">
        <div class="brand"><b>造物册</b><span>zaowuce.com</span></div>
        <p class="muted small">团队的工具工作台与知识库，仅限受邀成员。</p>
        <div class="field"><label for="l-acc">账号</label><input id="l-acc" autocomplete="username" value="member-a"></div>
        <div class="field"><label for="l-pw">密码</label><input id="l-pw" type="password" autocomplete="current-password" value="example"></div>
        <button class="btn primary" type="submit" style="justify-content:center">登录</button>
        <p class="small muted">没有账号？请联系站主开通。忘记密码也请联系站主重置。</p>
      </form>
    </div>`;

  /* ---------- 路由与交互 ---------- */
  function route() {
    const h = (location.hash || '#home').slice(1);
    const key = !state.loggedIn ? 'login' : (pages[h] ? h : 'home');
    root.innerHTML = pages[key]();
    document.title = '造物册工作台';
    window.scrollTo(0, 0);
    if (key === 'tool-dedupe') runDedupe();
  }

  function runDedupe() {
    const inp = document.getElementById('dd-in'), out = document.getElementById('dd-out');
    if (!inp) return;
    const lines = inp.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const seen = new Set(), res = [];
    lines.forEach(l => { if (!seen.has(l)) { seen.add(l); res.push(l); } });
    out.value = res.join('\n');
    document.getElementById('dd-stat').textContent = `${lines.length} 行 → ${res.length} 行，去掉 ${lines.length - res.length} 个重复`;
  }

  async function copy(text, el) {
    try { await navigator.clipboard.writeText(text); toast('已复制'); }
    catch (e) {
      if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      toast('无法自动复制，已选中文本，请手动复制');
    }
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-jump],[data-filter]');
    if (!t) return;
    if (t.dataset.filter) { state[t.dataset.filter] = t.dataset.v; route(); return; }
    if (t.dataset.jump) {
      const el = document.getElementById(t.dataset.jump);
      if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      document.querySelectorAll('.rail button').forEach(b => b.classList.toggle('on', b.dataset.jump === t.dataset.jump));
      return;
    }
    const a = t.dataset.act;
    if (a === 'menu') { document.getElementById('side').classList.add('open'); document.getElementById('scrim').classList.add('open'); }
    if (a === 'logout') { state.loggedIn = false; route(); }
    if (a === 'download') toast('原型：下载尚未接入');
    if (a === 'sample') toast('原型：样表包 SAMPLE-01 尚未制作');
    if (a === 'feedback') { e.preventDefault(); location.hash = 'states'; }
    if (a === 'clear-filters') { state.run = 'all'; state.mat = 'all'; route(); }
    if (a === 'dedupe') runDedupe();
    if (a === 'copy-dedupe') copy(document.getElementById('dd-out').value, null);
    if (a === 'copy-prompt') { const p = document.getElementById('prompt-text'); copy(p.textContent, p); }
    if (a === 'toggle') { const m = members[+t.dataset.i]; m.on = !m.on; route(); toast(m.on ? `已恢复 ${m.name}` : `已停用 ${m.name}`); }
    if (a === 'reset') toast(`已为 ${members[+t.dataset.i].name} 生成新密码（原型）`);
    if (a === 'reload') route();
  });
  document.addEventListener('click', e => {
    if (e.target.id === 'scrim' || (e.target.closest('.side a'))) {
      const s = document.getElementById('side'), c = document.getElementById('scrim');
      if (s) s.classList.remove('open'); if (c) c.classList.remove('open');
    }
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'search-form') { state.q = document.getElementById('q').value; if (location.hash === '#search') route(); else location.hash = 'search'; }
    if (e.target.id === 'login-form') { state.loggedIn = true; location.hash = 'home'; route(); }
    if (e.target.id === 'add-form') {
      const n = document.getElementById('m-name').value.trim(), acc = document.getElementById('m-acc').value.trim();
      if (!n || !acc) return;
      members.push({ name: n, account: acc, role: '成员', on: true }); route(); toast(`已开通 ${n}`);
    }
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
